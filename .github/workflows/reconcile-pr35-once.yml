name: reconcile-pr35-once

on:
  push:
    branches:
      - fix/post-refactor-review

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-refactor-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Reconcile, test and push
        run: python internal/scripts/reconcile_pr35_once.py
