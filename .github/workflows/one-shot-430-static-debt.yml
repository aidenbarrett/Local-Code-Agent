name: one-shot 430 static debt repair

on:
  push:
    branches:
      - chatgpt/401-static-product-roots

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/401-static-product-roots
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: python -m pip install -e ".[dev,lint]"
      - name: Wrap the #413 lines exposed by the expanded ratchet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("internal/scripts/acceptance-journeys.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '            expect(command in answer, f"{question!r}: the answer omitted the configured command {command!r}")',
                  '            expect(\n'
                  '                command in answer,\n'
                  '                f"{question!r}: the answer omitted the configured command {command!r}",\n'
                  '            )',
              ),
              (
                  '        s.journey.measured_as("answered", "every file the answers named exists; read them in the transcript")',
                  '        s.journey.measured_as(\n'
                  '            "answered", "every file the answers named exists; read them in the transcript"\n'
                  '        )',
              ),
              (
                  '    expect(_git(s.repo, "status", "--porcelain=v1") == before, "answering questions changed the repository")',
                  '    expect(\n'
                  '        _git(s.repo, "status", "--porcelain=v1") == before,\n'
                  '        "answering questions changed the repository",\n'
                  '    )',
              ),
              (
                  '        s.journey.measured_as("ungrounded", f"named files that do not exist: {invented}; repository unchanged")',
                  '        s.journey.measured_as(\n'
                  '            "ungrounded",\n'
                  '            f"named files that do not exist: {invented}; repository unchanged",\n'
                  '        )',
              ),
              (
                  '        s.journey.measured_as("answered", "every file the answers named exists; repository unchanged")',
                  '        s.journey.measured_as(\n'
                  '            "answered", "every file the answers named exists; repository unchanged"\n'
                  '        )',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed: expected one exact occurrence, found {count}: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Lock in only genuine static improvements
        run: |
          python internal/devtools/check_static_standards.py --update
          python internal/devtools/check_static_standards.py
          python -m pytest -q internal/tests/unit/test_static_standards_ratchet.py
          git diff --check
      - name: Commit repair and remove this one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-430-static-debt.yml
          git config user.name "ChatGPT Queue Maintainer"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix static debt exposed by expanded coverage"
          git push origin HEAD:chatgpt/401-static-product-roots
