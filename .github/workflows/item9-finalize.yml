name: Finalize item 9 persistence redaction

on:
  push:
    branches: [hardening/item9-persistence-redaction]
    paths: [tools/item9.trigger]

permissions:
  contents: write

concurrency:
  group: item9-persistence-redaction
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin starting point and install
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD main)" = "51ef8bc49c55668b7f751a1e09557caec3088f7e"
          python -m pip install -e ".[dev]"
      - name: Apply bounded privacy fix
        shell: bash
        run: |
          set -euo pipefail
          python tools/item9_patch.py
          git diff --check
      - name: Reconcile source-only generation-2 identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from local_agent import provenance as p

          path = Path('INSTRUMENT.json')
          declared = json.loads(path.read_text(encoding='utf-8'))
          if declared.get('generation') != 2:
              raise SystemExit('item 9 is only valid before generation-2 row one')

          prompt = p.base_prompt_sha256()
          outcome = p.outcome_contract_sha256()
          if prompt != declared.get('base_prompt_sha256'):
              raise SystemExit(f'base_prompt_sha256 moved unexpectedly: {prompt}')
          if outcome != declared.get('outcome_contract_sha256'):
              raise SystemExit(f'outcome_contract_sha256 moved unexpectedly: {outcome}')

          source = p.source_sha256()
          declared['source_sha256'] = source
          path.write_text(json.dumps(declared, indent=2) + '\n', encoding='utf-8', newline='\n')
          print('source_sha256', source)
          print('base_prompt_sha256', prompt)
          print('outcome_contract_sha256', outcome)
          PY
      - name: Targeted privacy regressions
        run: python -m pytest -q tests/integration/test_persistence_privacy.py tests/unit/test_run_manifest.py tests/unit/test_provenance.py
      - name: Full authoritative Linux pytest
        run: python -m pytest -q
      - name: Final identity check and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from local_agent import provenance as p
          declared = json.load(open('INSTRUMENT.json', encoding='utf-8'))
          actual = {
              'source_sha256': p.source_sha256(),
              'base_prompt_sha256': p.base_prompt_sha256(),
              'outcome_contract_sha256': p.outcome_contract_sha256(),
          }
          assert declared['generation'] == 2
          assert all(declared[k] == v for k, v in actual.items()), (declared, actual)
          print(json.dumps(actual, indent=2))
          PY
          rm -f .github/workflows/item9-finalize.yml tools/item9_patch.py tools/item9.trigger
          git diff --check
      - name: Commit one coherent source-and-identity change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "item9-finalizer"
          git config user.email "item9-finalizer@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Redact absolute paths at persistence boundaries"
          git push origin HEAD:hardening/item9-persistence-redaction
