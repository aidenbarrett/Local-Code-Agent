name: Finalize item 9 Windows cross-volume fix

on:
  push:
    branches: [hardening/item9-persistence-redaction]
    paths: [tools/item9-windows.trigger]

permissions:
  contents: write

concurrency:
  group: item9-windows-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded Windows fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/hardening/item9-persistence-redaction)"
          python -m pip install -e ".[dev]"
          python tools/item9_windows_fix.py
          git diff --check
      - name: Reconcile source-only identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from local_agent import provenance as p
          path = Path('INSTRUMENT.json')
          declared = json.loads(path.read_text(encoding='utf-8'))
          if declared.get('generation') != 2:
              raise SystemExit('expected generation 2')
          prompt = p.base_prompt_sha256()
          outcome = p.outcome_contract_sha256()
          if prompt != declared.get('base_prompt_sha256'):
              raise SystemExit(f'base prompt moved unexpectedly: {prompt}')
          if outcome != declared.get('outcome_contract_sha256'):
              raise SystemExit(f'outcome contract moved unexpectedly: {outcome}')
          declared['source_sha256'] = p.source_sha256()
          path.write_text(json.dumps(declared, indent=2) + '\n', encoding='utf-8', newline='\n')
          print('source_sha256', declared['source_sha256'])
          PY
      - name: Focused regression
        run: python -m pytest -q tests/integration/test_persistence_privacy.py tests/integration/test_oracle_isolation.py tests/unit/test_provenance.py
      - name: Remove one-shot machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/item9-windows-finalize.yml tools/item9_windows_fix.py tools/item9-windows.trigger
          python - <<'PY'
          import json
          from local_agent import provenance as p
          declared = json.load(open('INSTRUMENT.json', encoding='utf-8'))
          assert declared['generation'] == 2
          assert declared['source_sha256'] == p.source_sha256()
          assert declared['base_prompt_sha256'] == p.base_prompt_sha256()
          assert declared['outcome_contract_sha256'] == p.outcome_contract_sha256()
          PY
          git diff --check
          git config user.name "item9-finalizer"
          git config user.email "item9-finalizer@users.noreply.github.com"
          git add -A
          git commit -m "Handle cross-volume private transcript references"
          git push origin HEAD:hardening/item9-persistence-redaction
