name: integration eligibility

# Stacked PRs may run the normal matrix while they are being developed. Draft
# stacks are intentionally not integration candidates yet, so this workflow stays
# green-but-explicit for them. Once a PR is ready for review, a non-main base fails
# closed until the branch is reconciled directly onto main.
on:
  pull_request:

concurrency:
  group: integration-eligibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration-base:
    name: merge gate (base=main)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Require direct integration base when merge-ready
        env:
          LCA_PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python internal/devtools/check_integration_base.py
