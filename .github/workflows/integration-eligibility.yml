name: integration eligibility

# Stacked PRs are allowed to run the normal test matrix while they are being
# developed, but they are not integration candidates. A child merged into an
# already-merged feature branch can otherwise look "merged" while remaining
# unreachable from main. This dedicated red/green gate makes that state visible.
on:
  pull_request:

concurrency:
  group: integration-eligibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration-base:
    name: merge gate (base=main)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Require direct integration base
        run: python internal/devtools/check_integration_base.py
