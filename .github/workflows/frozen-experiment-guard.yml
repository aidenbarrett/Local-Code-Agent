name: frozen experiment guard

on:
  pull_request:

jobs:
  frozen-evidence:
    name: frozen experiment evidence unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse frozen experiment mutations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | \
            python internal/devtools/check_frozen_experiment_diff.py --nul
