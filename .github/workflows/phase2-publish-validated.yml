name: Phase2 publish validated candidate

on:
  push:
    branches: [tmp/phase2-ci-repair]
    paths: [tools/phase2-publish.trigger]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact driver
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          fetch-depth: 1

      - name: Checkout exact core patch source
        uses: actions/checkout@v4
        with:
          ref: 842d09dc75c7e4b04e6eea90c9ad374a79efc088
          path: core
          fetch-depth: 1

      - name: Checkout PR7 after direct Windows-workflow fix
        uses: actions/checkout@v4
        with:
          ref: 977c5a7474e87603e36d0524564c9b91d9f2f259
          path: repo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reproduce exact already-validated candidate
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git -C repo ls-remote origin refs/heads/hardening/phase2-evidence-contract | cut -f1)
          test "$remote" = "977c5a7474e87603e36d0524564c9b91d9f2f259"

          python core/tools/phase2_ci_fixes.py repo
          python driver/tools/phase2_eval_semantics.py repo
          python driver/tools/phase2_post_core_fixes.py repo
          python driver/tools/phase2_regressions.py repo
          python driver/tools/phase2_retry_additions.py repo
          python driver/tools/phase2_retry2.py repo
          python driver/tools/phase2_retry3.py repo
          python driver/tools/phase2_final_cutoff.py repo

          git -C repo diff --check

      - name: Reconcile and assert validated identities
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e ".[dev]"
          python benchmark_fixture/generate_project.py
          git diff --exit-code -- benchmark_fixture/cpp_project
          python - <<'PY'
          import json
          from pathlib import Path
          from local_agent import provenance as p

          expected = {
              "source_sha256": "7433a1e228839db9d6af7bbb7042d86f1200c93551e3c908437086061241cf6f",
              "base_prompt_sha256": "f1fb88236b18c2aa21d396a91cdc878274005cb47d687b1442811c6a740f1559",
              "outcome_contract_sha256": "63c4bf907baa0cf2e406696bb7d65cdf4eef8feac206408fb7e4ffc3cb26efa8",
          }
          actual = {
              "source_sha256": p.source_sha256(),
              "base_prompt_sha256": p.base_prompt_sha256(),
              "outcome_contract_sha256": p.outcome_contract_sha256(),
          }
          assert actual == expected, (actual, expected)

          path = Path("INSTRUMENT.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("generation") == 2
          data.update(actual)
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8", newline="\n")
          print(json.dumps(actual, indent=2))
          PY

      - name: Commit and push
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "phase2-finalizer"
          git config user.email "phase2-finalizer@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Finish phase 2 row-one trust gates"
          remote=$(git ls-remote origin refs/heads/hardening/phase2-evidence-contract | cut -f1)
          test "$remote" = "977c5a7474e87603e36d0524564c9b91d9f2f259"
          git push origin HEAD:hardening/phase2-evidence-contract
