name: contract declaration integrity

on:
  pull_request:

jobs:
  contract-declaration:
    name: frozen contract axes match declaration
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact source provenance and frozen contract axes
        run: python internal/devtools/finalize_change.py
