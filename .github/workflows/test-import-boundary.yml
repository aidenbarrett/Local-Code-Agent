name: test import boundary

on:
  pull_request:

jobs:
  offline-import-root:
    name: tests respect offline import root
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject repository-root-only test imports
        run: python internal/devtools/check_test_import_boundaries.py
