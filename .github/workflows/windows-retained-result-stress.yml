name: temporary Windows retained-result stress

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: retained-result-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retained-result-stress:
    name: retained-result fixture x12 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the exact retained-result test twelve times
        shell: pwsh
        run: |
          1..12 | ForEach-Object {
            Write-Host "retained-result stress iteration $_ of 12"
            python -m pytest -q -s internal/tests/unit/test_session_textual_retained_results.py::test_idle_hub_poll_does_not_reread_500_retained_results
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
