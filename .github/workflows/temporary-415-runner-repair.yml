name: temporary #415 owned-runner repair

on:
  push:
    branches: [chatgpt/415-owned-workspace-git-v2]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair lifecycle ownership and output bound
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path("internal/local_agent/tools/process_runner.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, name: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one target, found {count}")
              text = text.replace(old, new)

          def replace_between(start: str, end: str, new: str, name: str) -> None:
              global text
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"{name}: anchors changed")
              begin = text.index(start)
              finish = text.index(end, begin)
              text = text[:begin] + new + text[finish:]

          replace_once(
              dedent('''\
              class CommandOutputLimitError(RuntimeError):
                  """The command wrote more than the caller agreed to read; its output is not evidence."""
              '''),
              dedent('''\
              class CommandOutputLimitError(RuntimeError):
                  """Aggregate command output crossed the execution bound."""

                  def __init__(
                      self, observed_bytes: int, limit: int, *, cleanup_confirmed: bool | None,
                  ) -> None:
                      self.observed_bytes = observed_bytes
                      self.limit = limit
                      self.cleanup_confirmed = cleanup_confirmed
                      super().__init__(
                          f"command wrote {observed_bytes} aggregate bytes, over the {limit}-byte "
                          f"limit; process-tree cleanup confirmed={cleanup_confirmed}"
                      )
              '''),
              "output error",
          )

          helpers = dedent('''\
          def _snapshot_bytes(capture: IO[bytes]) -> bytes:
              """Read a fixed-length snapshot without moving an inherited file offset."""
              size = os.fstat(capture.fileno()).st_size
              if size == 0:
                  return b""
              with mmap.mmap(capture.fileno(), length=size, access=mmap.ACCESS_READ) as view:
                  return view[:]


          def _capture_size(captures: tuple[IO[bytes], IO[bytes]]) -> int:
              """Aggregate bytes written to stdout and stderr so one shared bound is enforced."""
              return sum(os.fstat(capture.fileno()).st_size for capture in captures)


          def _enforce_output_limit(
              proc: subprocess.Popen[bytes],
              tree: "_Tree",
              captures: tuple[IO[bytes], IO[bytes]],
              limit: int | None,
          ) -> None:
              if limit is None:
                  return
              observed = _capture_size(captures)
              if observed <= limit:
                  return
              tree.cleanup_confirmed = _kill_process_tree_best_effort(proc, tree.job)
              _bounded_reap(proc)
              raise CommandOutputLimitError(
                  observed, limit, cleanup_confirmed=tree.cleanup_confirmed
              )


          def _posix_exit_ready(proc: subprocess.Popen[bytes]) -> bool | None:
              """Observe exit without reaping the process-group leader when the OS supports it."""
              waitid = getattr(os, "waitid", None)
              p_pid = getattr(os, "P_PID", None)
              wnowait = getattr(os, "WNOWAIT", None)
              if waitid is None or p_pid is None or wnowait is None:
                  return None
              flags = os.WEXITED | os.WNOHANG | wnowait
              try:
                  return waitid(p_pid, proc.pid, flags) is not None
              except ChildProcessError:
                  return None


          def _posix_group_members(pgid: int, leader_pid: int) -> tuple[int, ...]:
              """Live members of the still-owned group, excluding its unreaped leader."""
              members: list[int] = []
              for process in psutil.process_iter(["pid", "status"]):
                  pid = process.pid
                  if pid == leader_pid:
                      continue
                  try:
                      if os.getpgid(pid) == pgid and process.status() != psutil.STATUS_ZOMBIE:
                          members.append(pid)
                  except (OSError, psutil.Error):
                      continue
              return tuple(members)


          def _wait_members_gone(pids: tuple[int, ...], timeout_s: float) -> bool:
              deadline = time.monotonic() + timeout_s
              while True:
                  alive: list[int] = []
                  for pid in pids:
                      try:
                          if psutil.Process(pid).status() != psutil.STATUS_ZOMBIE:
                              alive.append(pid)
                      except psutil.NoSuchProcess:
                          continue
                      except psutil.Error:
                          alive.append(pid)
                  if not alive:
                      return True
                  if time.monotonic() >= deadline:
                      return False
                  time.sleep(_CANCEL_POLL_S)


          @dataclass
          class _Tree:
          ''')
          replace_between(
              'def _snapshot_bytes(capture: IO[bytes], limit: int | None) -> bytes:\n',
              '@dataclass\nclass _Tree:\n',
              helpers,
              "capture helpers",
          )

          start_fn = dedent('''\
          def _start(spawn: Callable[[bool], subprocess.Popen[bytes]], tree: _Tree,
                     on_spawn: Callable[[], None] | None) -> subprocess.Popen[bytes]:
          ''')
          wait_fn = 'def _wait(proc: subprocess.Popen[bytes], tree: _Tree, deadline: float,\n'
          new_start = dedent('''\
          def _start(spawn: Callable[[bool], subprocess.Popen[bytes]], tree: _Tree,
                     on_spawn: Callable[[], None] | None) -> subprocess.Popen[bytes]:
              proc = spawn(tree.job is not None)
              try:
                  if on_spawn is not None:
                      # A durable receipt is written as soon as a process has existed. If
                      # that receipt fails, ownership still requires ending this process.
                      on_spawn()
              except BaseException:
                  if tree.job is not None:
                      # Windows child is still suspended and not yet adopted by the job.
                      with contextlib.suppress(OSError):
                          proc.kill()
                  else:
                      _kill_process_tree_best_effort(proc)
                  _bounded_reap(proc)
                  raise
              if tree.job is not None:
                  try:
                      tree.job.adopt_suspended(proc.pid)
                  except windows_job.JobContainmentError:
                      # adopt_suspended already ended the suspended child. Running again is
                      # not replaying an effect because the first child executed nothing.
                      _bounded_reap(proc)
                      tree.job.close()
                      tree.job = None
                      tree.containment = "visible_tree"
                      proc = spawn(False)
              return proc


          ''')
          replace_between(start_fn, wait_fn, new_start, "start ownership")

          new_wait = dedent('''\
          def _wait(
              proc: subprocess.Popen[bytes],
              tree: _Tree,
              deadline: float,
              probe: CancellationProbe | None,
              captures: tuple[IO[bytes], IO[bytes]],
              output_limit: int | None,
          ) -> int | None:
              """Wait for exit while preserving a safe POSIX group identity until cleanup."""
              while True:
                  try:
                      _enforce_output_limit(proc, tree, captures, output_limit)
                      if _probe_requested(probe):
                          tree.cancel_requested = True
                          tree.cleanup_confirmed = _kill_process_tree_best_effort(proc, tree.job)
                          _bounded_reap(proc)
                          return 130
                  except BaseException:
                      if proc.poll() is None:
                          _kill_process_tree_best_effort(proc, tree.job)
                          _bounded_reap(proc)
                      raise

                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      tree.timed_out = True
                      tree.cleanup_confirmed = _kill_process_tree_best_effort(proc, tree.job)
                      _bounded_reap(proc)
                      return 124

                  if os.name != "nt":
                      ready = _posix_exit_ready(proc)
                      if ready is True:
                          _enforce_output_limit(proc, tree, captures, output_limit)
                          # None means the leader is deliberately not reaped yet. Its PID
                          # still owns the group id, so post-exit killpg cannot hit a reused id.
                          return None
                      if ready is None:
                          # Without WNOWAIT we cannot safely retain group identity after
                          # reaping. Fail closed for workspace callers rather than guess.
                          try:
                              code = int(proc.wait(timeout=min(_CANCEL_POLL_S, remaining)))
                          except subprocess.TimeoutExpired:
                              continue
                          _enforce_output_limit(proc, tree, captures, output_limit)
                          tree.strays_unconfirmed = True
                          return code
                      time.sleep(min(_CANCEL_POLL_S, remaining))
                      continue

                  try:
                      code = int(proc.wait(timeout=min(_CANCEL_POLL_S, remaining)))
                  except subprocess.TimeoutExpired:
                      continue
                  _enforce_output_limit(proc, tree, captures, output_limit)
                  return code


          ''')
          replace_between(wait_fn, 'def _end_strays(tree: _Tree) -> None:\n', new_wait, "bounded wait")

          new_strays = dedent('''\
          def _end_strays(proc: subprocess.Popen[bytes], tree: _Tree) -> None:
              """End descendants abandoned by a normally exiting direct child."""
              if tree.timed_out or tree.cancel_requested:
                  return
              if tree.job is not None:
                  try:
                      tree.stray_descendants = tree.job.active_processes()
                  except windows_job.JobContainmentError:
                      tree.stray_descendants = None
                  if tree.stray_descendants != 0:
                      tree.cleanup_confirmed = tree.job.terminate_and_confirm(_STRAY_DRAIN_S)
                      tree.strays_unconfirmed = not tree.cleanup_confirmed
                  return
              if os.name == "nt":
                  # Job adoption failed. Once the direct child exits, visible-tree
                  # ancestry is not a containment primitive, so successful cleanup
                  # cannot be claimed.
                  tree.stray_descendants = None
                  tree.strays_unconfirmed = True
                  return
              if tree.strays_unconfirmed:
                  return

              # The direct child is still an unreaped zombie here. That reserves its PID
              # and therefore its process-group id, so this enumeration/kill cannot target
              # an unrelated group that reused the numeric id.
              members = _posix_group_members(proc.pid, proc.pid)
              tree.stray_descendants = len(members)
              if not members:
                  return
              with contextlib.suppress(ProcessLookupError):
                  os.killpg(proc.pid, signal.SIGKILL)
              _wait_members_gone(members, _POST_KILL_WAIT_S)
              # Process groups are escapable. We ended every observed in-group member,
              # but cannot promote that best effort to proof that no descendant escaped.
              tree.cleanup_confirmed = False
              tree.strays_unconfirmed = True


          ''')
          replace_between(
              'def _end_strays(tree: _Tree) -> None:\n',
              '@dataclass(frozen=True)\nclass OwnedLifecycle:\n',
              new_strays,
              "normal-exit strays",
          )

          replace_once(
              dedent('''\
                          proc = _start(spawn, tree, lifecycle.on_spawn)
                          code = _wait(proc, tree, started + lifecycle.timeout_s, lifecycle.cancellation_probe)
                          _end_strays(tree)
                          stdout = _snapshot_bytes(stdout_capture, lifecycle.output_limit)
                          stderr = _snapshot_bytes(stderr_capture, lifecycle.output_limit)
              '''),
              dedent('''\
                          proc = _start(spawn, tree, lifecycle.on_spawn)
                          captures = (stdout_capture, stderr_capture)
                          code = _wait(
                              proc,
                              tree,
                              started + lifecycle.timeout_s,
                              lifecycle.cancellation_probe,
                              captures,
                              lifecycle.output_limit,
                          )
                          _end_strays(proc, tree)
                          if code is None:
                              code = int(proc.wait(timeout=_POST_KILL_FORCE_WAIT_S))
                          stdout = _snapshot_bytes(stdout_capture)
                          stderr = _snapshot_bytes(stderr_capture)
              '''),
              "run_owned lifecycle",
          )

          replace_once(
              '    output_limit: int | None = None\n',
              '    # Aggregate stdout + stderr execution bound, checked while the tree runs.\n'
              '    output_limit: int | None = None\n',
              "lifecycle output comment",
          )

          path.write_text(text, encoding="utf-8")
      - name: Remove relay and compile
        run: |
          rm .github/workflows/temporary-415-runner-repair.yml
          git diff --check
          python -m compileall -q internal/local_agent/tools internal/tests/unit/test_owned_process_runner.py
      - name: Install focused dependencies
        run: python -m pip install -e ".[dev,lint]"
      - name: Static standards
        run: python internal/devtools/check_static_standards.py
      - name: Run owned-runner adversarial tests
        run: >-
          python -m pytest -q
          internal/tests/unit/test_owned_process_runner.py
          internal/tests/unit/test_runner_process_tree.py
          internal/tests/unit/test_process_runner_cancellation.py
          internal/tests/unit/test_windows_job_containment.py
      - name: Commit repair
        run: |
          git config user.name "Aiden Barrett"
          git config user.email "33842164+aidenbarrett@users.noreply.github.com"
          git add internal/local_agent/tools/process_runner.py internal/tests/unit/test_owned_process_runner.py .github/workflows/temporary-415-runner-repair.yml
          git commit -m "Repair owned process lifecycle boundaries"
          git push origin HEAD:chatgpt/415-owned-workspace-git-v2
