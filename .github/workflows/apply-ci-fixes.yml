# Temporary one-shot verifier. Removed after the repair commit lands.
name: apply-ci-fixes

on:
  push:
    branches:
      - refactor/ux-root-cleanup
    paths:
      - .github/workflows/apply-ci-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ux-root-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply fixes and restamp generation 2
        run: python internal/scripts/apply_ci_fixes_once.py
      - name: Authoritative Linux suite
        run: python -m pytest -q
      - name: Compatibility suite
        run: python internal/measurement/run_test_suite.py internal/tests
      - name: Instrument identity
        run: |
          python -c "import json,sys; from pathlib import Path; sys.path.insert(0,str(Path('internal').resolve())); from local_agent import provenance as p; d=json.loads(Path('internal/INSTRUMENT.json').read_text()); a={'source_sha256':p.source_sha256(),'base_prompt_sha256':p.base_prompt_sha256(),'outcome_contract_sha256':p.outcome_contract_sha256()}; assert all(d[k] == v for k,v in a.items()), (d,a)"
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "aidenbarrett"
          git config user.email "33842164+aidenbarrett@users.noreply.github.com"
          git add internal/INSTRUMENT.json internal/scripts/chat.py internal/scripts/capabilities.py internal/tests/unit/test_metrics_and_context.py internal/tests/unit/test_user_facing_entrypoints.py internal/tests/unit/test_windows_bootstrap_progress.py
          git diff --cached --check
          git commit -m "Fix CI after internal layout refactor"
          git push origin HEAD:refactor/ux-root-cleanup

  verify-windows:
    needs: apply-and-verify-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ux-root-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain identity
        shell: pwsh
        run: |
          python --version
          git --version
          cmake --version
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Regenerate fixture
        run: python internal/benchmark_fixture/generate_project.py
      - name: Authoritative Windows suite
        run: python -m pytest -q
      - name: Instrument identity
        shell: pwsh
        run: python -c "import json,sys; from pathlib import Path; sys.path.insert(0,str(Path('internal').resolve())); from local_agent import provenance as p; d=json.loads(Path('internal/INSTRUMENT.json').read_text()); a={'source_sha256':p.source_sha256(),'base_prompt_sha256':p.base_prompt_sha256(),'outcome_contract_sha256':p.outcome_contract_sha256()}; assert all(d[k] == v for k,v in a.items()), (d,a)"
