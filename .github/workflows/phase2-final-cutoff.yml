name: Phase2 final cutoff writer

on:
  push:
    branches: [tmp/phase2-ci-repair]
    paths: [tools/phase2-final.trigger]

permissions:
  contents: write

concurrency:
  group: phase2-final-cutoff-writer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact driver
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          fetch-depth: 1

      - name: Checkout exact core patch source
        uses: actions/checkout@v4
        with:
          ref: 842d09dc75c7e4b04e6eea90c9ad374a79efc088
          path: core
          fetch-depth: 1

      - name: Checkout exact PR starting commit
        uses: actions/checkout@v4
        with:
          ref: 2cbff355a63b2f45e0a423fe6ba34b723400b47c
          path: repo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pinned inputs and single-writer precondition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "842d09dc75c7e4b04e6eea90c9ad374a79efc088"
          test "$(git -C repo rev-parse HEAD)" = "2cbff355a63b2f45e0a423fe6ba34b723400b47c"
          remote=$(git -C repo ls-remote origin refs/heads/hardening/phase2-evidence-contract | cut -f1)
          test "$remote" = "2cbff355a63b2f45e0a423fe6ba34b723400b47c" || {
            echo "target branch moved: $remote"; exit 1;
          }
          test -z "$(git -C repo status --porcelain)"

      - name: Apply the bounded seven-item repair
        shell: bash
        run: |
          set -euo pipefail
          python core/tools/phase2_ci_fixes.py repo
          python driver/tools/phase2_eval_semantics.py repo
          python driver/tools/phase2_post_core_fixes.py repo
          python driver/tools/phase2_regressions.py repo
          python driver/tools/phase2_retry_additions.py repo
          python driver/tools/phase2_retry2.py repo
          python driver/tools/phase2_retry3.py repo
          python driver/tools/phase2_final_cutoff.py repo
          git -C repo diff --check

      - name: Install and regenerate fixture
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python benchmark_fixture/generate_project.py
          git diff --exit-code -- benchmark_fixture/cpp_project

      - name: Reconcile generation-2 identities after final code
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from local_agent import provenance as p

          path = Path("INSTRUMENT.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("generation") != 2:
              raise SystemExit("generation moved unexpectedly")
          data["source_sha256"] = p.source_sha256()
          data["base_prompt_sha256"] = p.base_prompt_sha256()
          data["outcome_contract_sha256"] = p.outcome_contract_sha256()
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8", newline="\n")
          for key in ("source_sha256", "base_prompt_sha256", "outcome_contract_sha256"):
              print(key, data[key])
          PY

      - name: Seven trust-boundary acceptance gates
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/unit/test_cross_platform_evidence.py \
            tests/unit/test_endpoint_analysis.py \
            tests/unit/test_repeat_collection.py \
            tests/unit/test_analysis_identity_guard.py \
            tests/unit/test_compat_runner_contract.py \
            tests/unit/test_provenance.py \
            tests/unit/test_bench_and_report.py \
            tests/integration/test_endpoint_row_contract.py \
            tests/integration/test_evaluator_cannot_be_fooled.py \
            tests/integration/test_oracle_isolation.py

      - name: Full authoritative Linux pytest
        working-directory: repo
        run: python -m pytest -q

      - name: Offline compatibility runner
        working-directory: repo
        run: python measurement/run_test_suite.py tests

      - name: Deterministic positive rehearsal across all conditions
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lca-phase2-final-rehearsal
          mkdir -p /tmp/lca-phase2-final-rehearsal
          for condition in control narrow skill; do
            python evaluation/run_evaluation.py \
              --rehearse --condition "$condition" --repeat 3 --max-attempts 5 \
              --out "/tmp/lca-phase2-final-rehearsal/${condition}.json" \
              --workdir "/tmp/lca-phase2-final-rehearsal/work-${condition}"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/lca-phase2-final-rehearsal')
          for condition in ('control', 'narrow', 'skill'):
              payload = json.loads((root / f'{condition}.json').read_text(encoding='utf-8'))
              assert payload['complete'] is True
              assert payload['rehearsal'] is True
              assert payload['generation'] == 2
              assert len(payload['rows']) == 30, (condition, len(payload['rows']))
              assert payload['attempts_declared'] == {row['case']: 3 for row in payload['rows']}
              assert all(row['condition'] == condition for row in payload['rows'])
              assert all(row['rehearsal'] is True for row in payload['rows'])
              assert all(row.get('error') is None for row in payload['rows'])
          print('positive rehearsal: 90 preserved rows, exact 3 attempts per cell')
          PY

      - name: Deterministic negative rehearsal proves discrimination
        working-directory: repo
        run: >-
          python -m pytest -q
          tests/integration/test_endpoint_row_contract.py::test_real_prose_row_is_known_noncompliance_not_unknown
          tests/unit/test_endpoint_analysis.py::test_oracle_tampering_is_terminal_nonreplaceable_model_behaviour
          tests/unit/test_endpoint_analysis.py::test_deleted_attempt_is_detected_from_manifest_count
          tests/unit/test_analysis_identity_guard.py::test_analysis_rejects_rehearsal_payload

      - name: Verify final instrument identity and fixture cleanliness
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python benchmark_fixture/generate_project.py
          git diff --exit-code -- benchmark_fixture/cpp_project
          python - <<'PY'
          import json
          from local_agent import provenance as p
          declared = json.load(open('INSTRUMENT.json', encoding='utf-8'))
          actual = {
              'source_sha256': p.source_sha256(),
              'base_prompt_sha256': p.base_prompt_sha256(),
              'outcome_contract_sha256': p.outcome_contract_sha256(),
          }
          assert declared['generation'] == 2
          assert all(declared[k] == v for k, v in actual.items()), (declared, actual)
          print(json.dumps(actual, indent=2))
          PY

      - name: Commit exact validated candidate
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "phase2-finalizer"
          git config user.email "phase2-finalizer@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Finish phase 2 row-one trust gates"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish only if target still equals pinned base
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/hardening/phase2-evidence-contract | cut -f1)
          test "$remote" = "2cbff355a63b2f45e0a423fe6ba34b723400b47c" || {
            echo "target moved after validation: $remote"; exit 1;
          }
          git push origin HEAD:hardening/phase2-evidence-contract
          echo "published candidate $candidate"
