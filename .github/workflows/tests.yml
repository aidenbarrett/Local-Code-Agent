name: tests

# The suite compiles and runs real C++ through CMake and CTest. Real pytest is
# authoritative on Linux and Windows; the compatibility runner remains an
# offline subset only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain identity
        run: |
          python --version
          cmake --version
          ctest --version

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build the fixture repository
        run: python internal/benchmark_fixture/generate_project.py

      - name: Authoritative test suite
        run: python -m pytest -q

  compatibility-runner:
    name: compatibility runner (offline subset)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build the fixture repository
        run: python internal/benchmark_fixture/generate_project.py

      - name: Compatibility suite
        run: python internal/measurement/run_test_suite.py internal/tests

  integrity:
    name: fixture and instrument integrity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Generated fixture matches the committed one
        run: |
          python internal/benchmark_fixture/generate_project.py
          git diff --exit-code -- internal/benchmark_fixture/cpp_project

      - name: Instrument identity matches internal/INSTRUMENT.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from local_agent import provenance as p

          with open("internal/INSTRUMENT.json", encoding="utf-8") as fh:
              declared = json.load(fh)
          actual = {
              "source_sha256": p.source_sha256(),
              "base_prompt_sha256": p.base_prompt_sha256(),
              "outcome_contract_sha256": p.outcome_contract_sha256(),
          }

          drift = []
          for key, value in actual.items():
              print(f"{key:<24} {value}")
              if declared.get(key) != value:
                  drift.append((key, declared.get(key), value))

          if not drift:
              print(f"\nmatches internal/INSTRUMENT.json, generation {declared['generation']}")
              sys.exit(0)

          print("\nINSTRUMENT DRIFT\n")
          for key, want, got in drift:
              print(f"  {key}")
              print(f"    declared  {want}")
              print(f"    computed  {got}")
          print()
          generation_axes = {"base_prompt_sha256", "outcome_contract_sha256"}
          if any(key in generation_axes for key, _, _ in drift):
              print("A model-facing or outcome-facing contract moved. That ENDS")
              print("A GENERATION once rows exist. Generation 2 currently has zero")
              print("collected rows, so this branch may freeze the prompt before its")
              print("first row; internal/INSTRUMENT.json must be updated in the same change.")
          else:
              print("source_sha256 moved without a contract-axis move. Update the")
              print("source hash in internal/INSTRUMENT.json after confirming the move is intended.")
          sys.exit(1)
          PY

# BEGIN TEMP_NAV_RESTAMP
  restamp-navigation-source:
    name: one-shot navigation source restamp
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/post-refactor-review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-refactor-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restamp source-only identity and remove temporary machinery
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'internal')
          from local_agent import provenance as p

          instrument = Path('internal/INSTRUMENT.json')
          data = json.loads(instrument.read_text(encoding='utf-8'))
          source = p.source_sha256()
          base = p.base_prompt_sha256()
          outcome = p.outcome_contract_sha256()
          assert base == data['base_prompt_sha256'], (base, data['base_prompt_sha256'])
          assert outcome == data['outcome_contract_sha256'], (outcome, data['outcome_contract_sha256'])
          data['source_sha256'] = source
          instrument.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/tests.yml')
          text = workflow.read_text(encoding='utf-8')
          start = text.index('\n# BEGIN TEMP_NAV_RESTAMP\n')
          workflow.write_text(text[:start] + '\n', encoding='utf-8')

          print('source_sha256', source)
          print('base_prompt_sha256', base)
          print('outcome_contract_sha256', outcome)
          PY
          rm -f .github/workflows/restamp-review-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/INSTRUMENT.json .github/workflows/tests.yml .github/workflows/restamp-review-source.yml
          git commit -m "Restamp source identity after repo navigation hardening"
          git push
# END TEMP_NAV_RESTAMP
