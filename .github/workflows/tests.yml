name: tests

# The suite compiles and runs real C++ through CMake and CTest. That is the
# point: the adversarial tests reproduce build and test cheats against a real
# toolchain, and mocking it would test the mock. Nothing here needs a model.
#
# Real pytest is authoritative. measurement/run_test_suite.py remains valuable
# for air-gapped/offline machines, but it implements only a compatibility subset
# of pytest and therefore gets its own non-authoritative job. A compatibility
# pass can never hide a native pytest failure again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain identity
        run: |
          python --version
          cmake --version
          ctest --version

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build the fixture repository
        run: python benchmark_fixture/generate_project.py

      - name: Authoritative test suite
        run: python -m pytest -q

  compatibility-runner:
    name: compatibility runner (offline subset)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build the fixture repository
        run: python benchmark_fixture/generate_project.py

      - name: Compatibility suite
        run: python measurement/run_test_suite.py tests

  integrity:
    name: fixture and instrument integrity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      # The fixture is hashed; its generator is not. If these differ then the
      # instrument identity depends on whether somebody happened to run the
      # generator before hashing it.
      - name: Generated fixture matches the committed one
        run: |
          python benchmark_fixture/generate_project.py
          git diff --exit-code -- benchmark_fixture/cpp_project

      # Provenance is load-bearing: every dataset is reconciled against these
      # hashes. Keep this as a separate gate so a test-runner implementation can
      # never redefine what a green identity check means.
      - name: Instrument identity matches INSTRUMENT.json
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from local_agent import provenance as p

          with open("INSTRUMENT.json", encoding="utf-8") as fh:
              declared = json.load(fh)
          actual = {
              "source_sha256": p.source_sha256(),
              "base_prompt_sha256": p.base_prompt_sha256(),
              "outcome_contract_sha256": p.outcome_contract_sha256(),
          }

          drift = []
          for key, value in actual.items():
              print(f"{key:<24} {value}")
              if declared.get(key) != value:
                  drift.append((key, declared.get(key), value))

          if not drift:
              print(f"\nmatches INSTRUMENT.json, generation {declared['generation']}")
              sys.exit(0)

          print("\nINSTRUMENT DRIFT\n")
          for key, want, got in drift:
              print(f"  {key}")
              print(f"    declared  {want}")
              print(f"    computed  {got}")
          print()
          generation_axes = {"base_prompt_sha256", "outcome_contract_sha256"}
          if any(key in generation_axes for key, _, _ in drift):
              print("A model-facing or outcome-facing contract moved. That ENDS")
              print("A GENERATION: either what the model sees/submits or what the")
              print("evaluator calls correct changed. Data does not cross that")
              print("boundary as confirmatory evidence in either direction.")
              print("Increment 'generation' in INSTRUMENT.json and record the")
              print("change in docs/experiment-design.md.")
          else:
              print("source_sha256 moved without a contract-axis move. Update the")
              print("source hash in INSTRUMENT.json; whether archived rows can be")
              print("re-scored is decided from their retained evidence, not guessed.")
          sys.exit(1)
          PY
