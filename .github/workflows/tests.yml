name: tests

# The suite compiles and runs real C++ through cmake and ctest. That is the
# point: the adversarial tests reproduce build and test cheats against a real
# toolchain, and mocking it would test the mock. Nothing here needs a model.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain
        run: |
          cmake --version
          ctest --version
          g++ --version

      - name: Install
        run: pip install -e ".[dev]"

      - name: Build the fixture repository
        run: python benchmark_fixture/generate_project.py

      - name: Test suite
        run: python measurement/run_test_suite.py tests

      # Provenance is load-bearing: every dataset is reconciled against these
      # hashes, so a change that alters them without anyone noticing is how a
      # dataset silently stops matching the package that produced it.
      - name: Package identity
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from local_agent import provenance as p
          print("source_sha256      ", p.source_sha256())
          print("base_prompt_sha256 ", p.base_prompt_sha256())
          PY
