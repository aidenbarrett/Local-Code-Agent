name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: fast gates
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Capture declared CI job scope and checkout identity
        env:
          LCA_ARTIFACT_NAME: ci-job-tests-gates-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          LCA_COMMAND_SCOPE: fast-gates
          LCA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LCA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LCA_CHECKOUT_EVIDENCE: ci-job-evidence.json
        run: python internal/devtools/capture_ci_checkout.py
      - name: Upload declared CI job scope and checkout identity
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-tests-gates-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          path: ci-job-evidence.json
          if-no-files-found: error
      - name: Install
        run: python -m pip install -e ".[dev,lint]"
      - name: Static standards ratchet (strict mypy on linux and win32, ruff)
        run: python internal/devtools/check_static_standards.py
      - name: CURRENT_STATE drift guard
        run: python internal/devtools/check_current_state_drift.py --max-behind 5
      - name: Session Hub acceptance gates
        run: python internal/scripts/accept-session-hub.py
      - name: Session event contract
        run: python -m pytest -q internal/tests/unit/test_session_contract_schema.py
      - name: Product outcome contracts
        run: python -m pytest -q internal/tests/unit/test_outcomes.py internal/tests/unit/test_ledger_outcome_partition.py
      - name: Cleanup and harness contracts
        run: python -m pytest -q internal/tests/unit/test_no_legacy_experiment_references.py internal/tests/unit/test_endpoint_harness.py
      - name: Syntax scan
        run: python -m pytest -q internal/tests/unit/test_no_syntax_warnings.py

  pytest-shard:
    # The authoritative suite, split into whole-file shards balanced by recorded time
    # (internal/devtools/ci_shards.py). The shards partition what pytest collects, so
    # every test still runs on both platforms; only wall-clock time changes. Windows
    # is the slow platform, so it gets five runners, balanced on its own recorded times.
    name: pytest ${{ matrix.shard }} (${{ matrix.os }})
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, shard: "1/1", shard_id: "1of1"}
          - {os: windows-latest, shard: "1/5", shard_id: "1of5"}
          - {os: windows-latest, shard: "2/5", shard_id: "2of5"}
          - {os: windows-latest, shard: "3/5", shard_id: "3of5"}
          - {os: windows-latest, shard: "4/5", shard_id: "4of5"}
          - {os: windows-latest, shard: "5/5", shard_id: "5of5"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Capture declared CI job scope and checkout identity
        env:
          LCA_ARTIFACT_NAME: ci-job-tests-pytest-${{ matrix.shard_id }}-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          LCA_COMMAND_SCOPE: authoritative-pytest
          LCA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LCA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LCA_CHECKOUT_EVIDENCE: ci-job-evidence.json
        run: python internal/devtools/capture_ci_checkout.py
      - name: Upload declared CI job scope and checkout identity
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-tests-pytest-${{ matrix.shard_id }}-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          path: ci-job-evidence.json
          if-no-files-found: error
      - name: Install
        # This suite includes an integration regression that invokes the real pinned
        # mypy/Ruff gate against temporary copies of every live Python root.
        run: python -m pip install -e ".[dev,lint]"
      - name: Authoritative test suite
        # The slowest tests are listed so a suite drifting toward the job timeout is
        # visible before it goes red (Windows runs near 35 of its 45 minutes).
        run: python -m pytest -q --shard ${{ matrix.shard }} --durations=30 --durations-min=5 --junitxml=pytest-junit.xml
      - name: Annotate failed tests
        # The job log is not always readable by whoever fixes the failure; the checks
        # API always returns annotations. One error annotation per failed test.
        if: failure()
        run: python internal/devtools/annotate_test_failures.py pytest-junit.xml
      - name: Report where the time went
        if: always()
        run: python internal/devtools/ci_shards.py report pytest-junit.xml

  qualification:
    # Q01-Q05 on a pinned real repository (#418, internal/acceptance/corpus.toml):
    # deterministic and model-free. The corpus is cached by commit; a miss fetches it
    # here, because CI is online. Product runs never fetch silently.
    name: qualification (${{ matrix.os }})
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # About ten full builds of a real project; MSVC is several times slower than GCC.
    timeout-minutes: 90
    env:
      LCA_QUALIFICATION_CACHE: ${{ github.workspace }}/../lca-qualification-cache
      LCA_REQUIRE_QUALIFICATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Corpus commit
        id: corpus
        shell: bash
        run: |
          echo "key=$(python -c "import sys; sys.path.insert(0, 'internal'); from scripts.acceptance_corpus import load_manifest; print('-'.join(f'{e.name}-{e.commit}' for e in load_manifest().values()))")" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned corpus
        uses: actions/cache@v4
        with:
          path: ${{ env.LCA_QUALIFICATION_CACHE }}
          key: qualification-corpus-${{ runner.os }}-${{ steps.corpus.outputs.key }}
      - name: Fetch the pinned corpus (cache miss only fetches)
        run: python internal/scripts/acceptance-journeys.py --corpus cxxopts --fetch --corpus-cache "${{ env.LCA_QUALIFICATION_CACHE }}"
      - name: Q01-Q05 on the real repository
        # A short base temp keeps nested MSBuild try-compile paths under MAX_PATH.
        run: python -m pytest -q internal/tests/unit/test_corpus_journeys.py --junitxml=pytest-junit.xml --basetemp="${{ runner.temp }}/q"
      - name: Annotate failed journeys
        # Job logs are not always readable; annotations are.
        if: failure()
        run: python internal/devtools/annotate_test_failures.py pytest-junit.xml
      - name: Processes left after qualification
        # Evidence for #438 review: anything still running here was started by the run.
        # The harness's own builds disable MSBuild node reuse, so a survivor is a finding.
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, psutil
          me = os.getpid()
          names = ("msbuild", "vctip", "cl.exe", "link.exe", "cmake", "ctest", "ninja", "make")
          left = []
          for proc in psutil.process_iter(["pid", "name", "cmdline", "create_time"]):
              name = (proc.info["name"] or "").lower()
              if proc.pid != me and any(n in name for n in names):
                  left.append(f"{proc.pid} {name} {' '.join(proc.info['cmdline'] or [])[:200]}")
          print(f"::notice title=processes left after qualification::{len(left)}: " + " | ".join(left)[:3000])
          PY

  pytest:
    # One result per platform, named as before, green only if every shard passed.
    name: pytest (${{ matrix.os }})
    needs: pytest-shard
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.pytest-shard.result }}" = "success"

  coverage:
    name: coverage (report only)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Capture declared CI job scope and checkout identity
        env:
          LCA_ARTIFACT_NAME: ci-job-tests-coverage-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          LCA_COMMAND_SCOPE: coverage-report
          LCA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LCA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LCA_CHECKOUT_EVIDENCE: ci-job-evidence.json
        run: python internal/devtools/capture_ci_checkout.py
      - name: Upload declared CI job scope and checkout identity
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-tests-coverage-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          path: ci-job-evidence.json
          if-no-files-found: error
      - name: Install
        # Coverage collects the same suite, including the real static-gate regression.
        run: python -m pip install -e ".[coverage,lint]"
      - name: Measure coverage
        run: python -m pytest -q --cov --cov-report=xml --cov-report=term-missing:skip-covered --junitxml=pytest-junit.xml
      - name: Annotate failed tests
        if: failure()
        run: python internal/devtools/annotate_test_failures.py pytest-junit.xml
      - name: Report what is uncovered
        run: python internal/scripts/coverage-report.py coverage.xml --against internal/coverage-baseline.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn