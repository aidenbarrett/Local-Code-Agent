name: tests

# The suite compiles and runs real C++ through cmake and ctest. That is the
# point: the adversarial tests reproduce build and test cheats against a real
# toolchain, and mocking it would test the mock. Nothing here needs a model.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain
        run: |
          cmake --version
          ctest --version
          g++ --version

      - name: Install
        run: pip install -e ".[dev]"

      - name: Build the fixture repository
        run: python benchmark_fixture/generate_project.py

      - name: Test suite
        run: python measurement/run_test_suite.py tests

      # Provenance is load-bearing: every dataset is reconciled against these
      # hashes, so a change that alters them without anyone noticing is how a
      # dataset silently stops matching the package that produced it.
      #
      # This step used to print the two values and exit zero, which meant a
      # green run said nothing whatsoever about instrument identity. It now
      # compares them against the declaration in INSTRUMENT.json and fails on a
      # mismatch, so a change to measured behaviour cannot land unless somebody
      # updates that file deliberately in the same commit.
      # The fixture is hashed; its generator is not. So the two must agree, or
      # source_sha256 depends on whether anyone happened to run the generator.
      # That is not hypothetical: the Windows portability work landed a fixture
      # and a generator that emitted different assertion macros, and the branch
      # hashed to one value before the generator ran and another after.
      - name: Generated fixture matches the committed one
        run: |
          python benchmark_fixture/generate_project.py
          git diff --exit-code -- benchmark_fixture/cpp_project

      - name: Instrument identity matches INSTRUMENT.json
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from local_agent import provenance as p

          declared = json.load(open("INSTRUMENT.json"))
          actual = {
              "source_sha256": p.source_sha256(),
              "base_prompt_sha256": p.base_prompt_sha256(),
          }

          drift = []
          for key, value in actual.items():
              print(f"{key:<20} {value}")
              if declared[key] != value:
                  drift.append((key, declared[key], value))

          if not drift:
              print(f"\nmatches INSTRUMENT.json, generation {declared['generation']}")
              sys.exit(0)

          print("\nINSTRUMENT DRIFT\n")
          for key, want, got in drift:
              print(f"  {key}")
              print(f"    declared  {want}")
              print(f"    computed  {got}")
          print()
          if any(key == "base_prompt_sha256" for key, _, _ in drift):
              print("base_prompt_sha256 moved. That ENDS A GENERATION: what the")
              print("model is told, or what its answer is judged by, has changed,")
              print("and datasets do not cross that boundary in either direction.")
              print("Increment 'generation' in INSTRUMENT.json and record what")
              print("changed in the Generations table in docs/experiment-design.md.")
          else:
              print("source_sha256 moved. If the change is not model-facing the")
              print("generation stands; update source_sha256 in INSTRUMENT.json in")
              print("this commit and say what changed.")
          sys.exit(1)
          PY
