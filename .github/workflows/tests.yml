name: tests

# The suite compiles and runs real C++ through CMake and CTest. Real pytest is
# authoritative on Linux and Windows; the compatibility runner remains an
# offline subset only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain identity
        run: |
          python --version
          cmake --version
          ctest --version

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build the fixture repository
        run: python internal/benchmark_fixture/generate_project.py

      - name: Authoritative test suite
        run: python -m pytest -q

  compatibility-runner:
    name: compatibility runner (offline subset)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build the fixture repository
        run: python internal/benchmark_fixture/generate_project.py

      - name: Compatibility suite
        run: python internal/measurement/run_test_suite.py internal/tests

  integrity:
    name: fixture and instrument integrity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Generated fixture matches the committed one
        run: |
          python internal/benchmark_fixture/generate_project.py
          git diff --exit-code -- internal/benchmark_fixture/cpp_project

      - name: Instrument identity matches INSTRUMENT.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from local_agent import provenance as p

          with open("INSTRUMENT.json", encoding="utf-8") as fh:
              declared = json.load(fh)
          actual = {
              "source_sha256": p.source_sha256(),
              "base_prompt_sha256": p.base_prompt_sha256(),
              "outcome_contract_sha256": p.outcome_contract_sha256(),
          }

          drift = []
          for key, value in actual.items():
              print(f"{key:<24} {value}")
              if declared.get(key) != value:
                  drift.append((key, declared.get(key), value))

          if not drift:
              print(f"\nmatches INSTRUMENT.json, generation {declared['generation']}")
              sys.exit(0)

          print("\nINSTRUMENT DRIFT\n")
          for key, want, got in drift:
              print(f"  {key}")
              print(f"    declared  {want}")
              print(f"    computed  {got}")
          print()
          generation_axes = {"base_prompt_sha256", "outcome_contract_sha256"}
          if any(key in generation_axes for key, _, _ in drift):
              print("A model-facing or outcome-facing contract moved. That ENDS")
              print("A GENERATION once rows exist. Generation 2 currently has zero")
              print("collected rows, so this branch may freeze the prompt before its")
              print("first row; INSTRUMENT.json must be updated in the same change.")
          else:
              print("source_sha256 moved without a contract-axis move. Update the")
              print("source hash in INSTRUMENT.json after confirming the move is intended.")
          sys.exit(1)
          PY
