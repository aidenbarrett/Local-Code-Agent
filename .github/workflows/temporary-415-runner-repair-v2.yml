name: temporary #415 runner repair v2

on:
  push:
    branches: [chatgpt/415-owned-workspace-git-v2]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply standards-clean lifecycle repair
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path("internal/local_agent/tools/process_runner.py")
          text = path.read_text(encoding="utf-8")

          def once(old: str, new: str, name: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one target, found {count}")
              text = text.replace(old, new)

          def between(start: str, end: str, new: str, name: str) -> None:
              global text
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"{name}: anchors changed")
              a = text.index(start)
              b = text.index(end, a)
              text = text[:a] + new + text[b:]

          once(
              dedent('''\
              class CommandOutputLimitError(RuntimeError):
                  """The command wrote more than the caller agreed to read; its output is not evidence."""
              '''),
              dedent('''\
              class CommandOutputLimitError(RuntimeError):
                  """Aggregate command output crossed the execution bound."""

                  def __init__(
                      self, observed_bytes: int, limit: int, *, cleanup_confirmed: bool | None,
                  ) -> None:
                      self.observed_bytes = observed_bytes
                      self.limit = limit
                      self.cleanup_confirmed = cleanup_confirmed
                      super().__init__(
                          f"command wrote {observed_bytes} aggregate bytes, over the {limit}-byte "
                          f"limit; process-tree cleanup confirmed={cleanup_confirmed}"
                      )
              '''),
              "output error",
          )

          helpers = dedent('''\
          def _snapshot_bytes(capture: IO[bytes]) -> bytes:
              """Read a fixed-length snapshot without moving an inherited file offset."""
              size = os.fstat(capture.fileno()).st_size
              if size == 0:
                  return b""
              with mmap.mmap(capture.fileno(), length=size, access=mmap.ACCESS_READ) as view:
                  return view[:]


          def _capture_size(captures: tuple[IO[bytes], IO[bytes]]) -> int:
              return sum(os.fstat(capture.fileno()).st_size for capture in captures)


          def _enforce_output_limit(
              proc: subprocess.Popen[bytes],
              tree: _Tree,
              captures: tuple[IO[bytes], IO[bytes]],
              limit: int | None,
          ) -> None:
              if limit is None:
                  return
              observed = _capture_size(captures)
              if observed <= limit:
                  return
              tree.cleanup_confirmed = _kill_process_tree_best_effort(proc, tree.job)
              _bounded_reap(proc)
              raise CommandOutputLimitError(
                  observed, limit, cleanup_confirmed=tree.cleanup_confirmed
              )


          def _os_int(name: str) -> int | None:
              value = getattr(os, name, None)
              return value if isinstance(value, int) else None


          def _posix_exit_ready(proc: subprocess.Popen[bytes]) -> bool | None:
              """Observe exit without reaping the group leader when the OS supports it."""
              waitid = getattr(os, "waitid", None)
              p_pid = _os_int("P_PID")
              wexited = _os_int("WEXITED")
              wnohang = _os_int("WNOHANG")
              wnowait = _os_int("WNOWAIT")
              if not callable(waitid) or None in (p_pid, wexited, wnohang, wnowait):
                  return None
              assert p_pid is not None and wexited is not None
              assert wnohang is not None and wnowait is not None
              try:
                  return waitid(p_pid, proc.pid, wexited | wnohang | wnowait) is not None
              except ChildProcessError:
                  return None


          def _posix_group_members(pgid: int, leader_pid: int) -> tuple[int, ...]:
              getpgid = getattr(os, "getpgid", None)
              if not callable(getpgid):
                  return ()
              members: list[int] = []
              for process in psutil.process_iter(["pid", "status"]):
                  if process.pid == leader_pid:
                      continue
                  try:
                      if getpgid(process.pid) == pgid and process.status() != psutil.STATUS_ZOMBIE:
                          members.append(process.pid)
                  except (OSError, psutil.Error):
                      continue
              return tuple(members)


          def _wait_members_gone(pids: tuple[int, ...], timeout_s: float) -> bool:
              deadline = time.monotonic() + timeout_s
              while True:
                  alive: list[int] = []
                  for pid in pids:
                      try:
                          if psutil.Process(pid).status() != psutil.STATUS_ZOMBIE:
                              alive.append(pid)
                      except psutil.NoSuchProcess:
                          continue
                      except psutil.Error:
                          alive.append(pid)
                  if not alive:
                      return True
                  if time.monotonic() >= deadline:
                      return False
                  time.sleep(_CANCEL_POLL_S)


          ''')
          between(
              'def _snapshot_bytes(capture: IO[bytes], limit: int | None) -> bytes:\n',
              '@dataclass\nclass _Tree:\n', helpers, "capture helpers",
          )

          tree_anchor = dedent('''\
          @dataclass
          class _Tree:
              """Mutable lifecycle state of one owned run."""

              job: windows_job.ProcessTreeJob | None
              containment: str
              timed_out: bool = False
              cancel_requested: bool = False
              cleanup_confirmed: bool | None = None
              stray_descendants: int | None = None
              strays_unconfirmed: bool = False


          ''')
          wait_context = tree_anchor + dedent('''\
          @dataclass(frozen=True)
          class _WaitContext:
              deadline: float
              probe: CancellationProbe | None
              captures: tuple[IO[bytes], IO[bytes]]
              output_limit: int | None


          ''')
          once(tree_anchor, wait_context, "wait context")

          start_sig = dedent('''\
          def _start(spawn: Callable[[bool], subprocess.Popen[bytes]], tree: _Tree,
                     on_spawn: Callable[[], None] | None) -> subprocess.Popen[bytes]:
          ''')
          wait_sig = 'def _wait(proc: subprocess.Popen[bytes], tree: _Tree, deadline: float,\n'
          new_start = dedent('''\
          def _start(spawn: Callable[[bool], subprocess.Popen[bytes]], tree: _Tree,
                     on_spawn: Callable[[], None] | None) -> subprocess.Popen[bytes]:
              proc = spawn(tree.job is not None)
              try:
                  if on_spawn is not None:
                      on_spawn()
              except BaseException:
                  if tree.job is not None:
                      with contextlib.suppress(OSError):
                          proc.kill()
                  else:
                      _kill_process_tree_best_effort(proc)
                  _bounded_reap(proc)
                  raise
              if tree.job is not None:
                  try:
                      tree.job.adopt_suspended(proc.pid)
                  except windows_job.JobContainmentError:
                      _bounded_reap(proc)
                      tree.job.close()
                      tree.job = None
                      tree.containment = "visible_tree"
                      proc = spawn(False)
              return proc


          ''')
          between(start_sig, wait_sig, new_start, "start ownership")

          new_wait = dedent('''\
          def _wait(
              proc: subprocess.Popen[bytes], tree: _Tree, context: _WaitContext,
          ) -> int | None:
              """Wait while preserving safe POSIX group identity until stray cleanup."""
              while True:
                  try:
                      _enforce_output_limit(
                          proc, tree, context.captures, context.output_limit
                      )
                      if _probe_requested(context.probe):
                          tree.cancel_requested = True
                          tree.cleanup_confirmed = _kill_process_tree_best_effort(proc, tree.job)
                          _bounded_reap(proc)
                          return 130
                  except BaseException:
                      if proc.poll() is None:
                          _kill_process_tree_best_effort(proc, tree.job)
                          _bounded_reap(proc)
                      raise

                  remaining = context.deadline - time.monotonic()
                  if remaining <= 0:
                      tree.timed_out = True
                      tree.cleanup_confirmed = _kill_process_tree_best_effort(proc, tree.job)
                      _bounded_reap(proc)
                      return 124

                  if os.name != "nt":
                      ready = _posix_exit_ready(proc)
                      if ready is True:
                          _enforce_output_limit(
                              proc, tree, context.captures, context.output_limit
                          )
                          return None
                      if ready is None:
                          try:
                              code = int(proc.wait(timeout=min(_CANCEL_POLL_S, remaining)))
                          except subprocess.TimeoutExpired:
                              continue
                          _enforce_output_limit(
                              proc, tree, context.captures, context.output_limit
                          )
                          tree.strays_unconfirmed = True
                          return code
                      time.sleep(min(_CANCEL_POLL_S, remaining))
                      continue

                  try:
                      code = int(proc.wait(timeout=min(_CANCEL_POLL_S, remaining)))
                  except subprocess.TimeoutExpired:
                      continue
                  _enforce_output_limit(
                      proc, tree, context.captures, context.output_limit
                  )
                  return code


          ''')
          between(wait_sig, 'def _end_strays(tree: _Tree) -> None:\n', new_wait, "wait loop")

          new_strays = dedent('''\
          def _end_strays(proc: subprocess.Popen[bytes], tree: _Tree) -> None:
              """End descendants abandoned by a normally exiting direct child."""
              if tree.timed_out or tree.cancel_requested:
                  return
              if tree.job is not None:
                  try:
                      tree.stray_descendants = tree.job.active_processes()
                  except windows_job.JobContainmentError:
                      tree.stray_descendants = None
                  if tree.stray_descendants != 0:
                      tree.cleanup_confirmed = tree.job.terminate_and_confirm(_STRAY_DRAIN_S)
                      tree.strays_unconfirmed = not tree.cleanup_confirmed
                  return
              if os.name == "nt":
                  tree.stray_descendants = None
                  tree.strays_unconfirmed = True
                  return
              if tree.strays_unconfirmed:
                  return

              members = _posix_group_members(proc.pid, proc.pid)
              tree.stray_descendants = len(members)
              if not members:
                  return
              killpg = getattr(os, "killpg", None)
              sigkill = getattr(signal, "SIGKILL", None)
              if callable(killpg) and sigkill is not None:
                  with contextlib.suppress(ProcessLookupError):
                      killpg(proc.pid, sigkill)
              _wait_members_gone(members, _POST_KILL_WAIT_S)
              # POSIX groups are escapable, so observed cleanup is not proof that every
              # descendant stayed in the group. Workspace callers fail closed on this.
              tree.cleanup_confirmed = False
              tree.strays_unconfirmed = True


          ''')
          between(
              'def _end_strays(tree: _Tree) -> None:\n',
              '@dataclass(frozen=True)\nclass OwnedLifecycle:\n', new_strays, "stray cleanup",
          )

          old_run = (
              '            proc = _start(spawn, tree, lifecycle.on_spawn)\n'
              '            code = _wait(proc, tree, started + lifecycle.timeout_s, lifecycle.cancellation_probe)\n'
              '            _end_strays(tree)\n'
              '            stdout = _snapshot_bytes(stdout_capture, lifecycle.output_limit)\n'
              '            stderr = _snapshot_bytes(stderr_capture, lifecycle.output_limit)\n'
          )
          new_run = (
              '            proc = _start(spawn, tree, lifecycle.on_spawn)\n'
              '            captures = (stdout_capture, stderr_capture)\n'
              '            wait = _WaitContext(\n'
              '                started + lifecycle.timeout_s, lifecycle.cancellation_probe,\n'
              '                captures, lifecycle.output_limit,\n'
              '            )\n'
              '            code = _wait(proc, tree, wait)\n'
              '            _end_strays(proc, tree)\n'
              '            if code is None:\n'
              '                code = int(proc.wait(timeout=_POST_KILL_FORCE_WAIT_S))\n'
              '            stdout = _snapshot_bytes(stdout_capture)\n'
              '            stderr = _snapshot_bytes(stderr_capture)\n'
          )
          once(old_run, new_run, "run_owned lifecycle")
          once(
              '    output_limit: int | None = None\n',
              '    # Aggregate stdout + stderr execution bound, checked while running.\n'
              '    output_limit: int | None = None\n',
              "output limit contract",
          )
          path.write_text(text, encoding="utf-8")
      - name: Remove relay and compile
        run: |
          rm .github/workflows/temporary-415-runner-repair-v2.yml
          git diff --check
          python -m compileall -q internal/local_agent/tools internal/tests/unit/test_owned_process_runner.py
      - name: Install focused dependencies
        run: python -m pip install -e ".[dev,lint]"
      - name: Lower static baseline only if there are no regressions
        run: |
          python internal/devtools/check_static_standards.py --update
          python internal/devtools/check_static_standards.py
      - name: Run owned-runner adversarial tests
        run: >-
          python -m pytest -q
          internal/tests/unit/test_owned_process_runner.py
          internal/tests/unit/test_runner_process_tree.py
          internal/tests/unit/test_process_runner_cancellation.py
          internal/tests/unit/test_windows_job_containment.py
      - name: Commit repair
        run: |
          git config user.name "Aiden Barrett"
          git config user.email "33842164+aidenbarrett@users.noreply.github.com"
          git add internal/local_agent/tools/process_runner.py internal/static-standards-baseline.json internal/tests/unit/test_owned_process_runner.py .github/workflows/temporary-415-runner-repair-v2.yml
          git commit -m "Repair owned process lifecycle boundaries"
          git push origin HEAD:chatgpt/415-owned-workspace-git-v2
