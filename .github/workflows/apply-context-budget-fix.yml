name: apply NPU context budget hardening

on:
  push:
    branches: [fix/post-refactor-review]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-refactor-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply context-budget fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Context budgeting must account for tool schemas/chat-template overhead,
          # not just message text. Successful server usage calibrates the estimate.
          path = Path('internal/local_agent/agent/context.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
          '''    budget_tokens: int = 12_000\n    keep_recent_tool_results: int = 6\n    hysteresis: float = 0.55\n    messages: list[dict[str, Any]] = field(default_factory=list)\n    compactions: list[CompactionEvent] = field(default_factory=list)\n''',
          '''    # Total request budget, not just visible message text. Tool schemas and\n    # chat-template framing consume prompt tokens too.\n    budget_tokens: int = 12_000\n    keep_recent_tool_results: int = 6\n    hysteresis: float = 0.55\n    request_overhead_tokens: int = 0\n    calibration_margin_tokens: int = 128\n    messages: list[dict[str, Any]] = field(default_factory=list)\n    compactions: list[CompactionEvent] = field(default_factory=list)\n''')
          text = text.replace(
          '''    @property\n    def tokens(self) -> int:\n        return approximate_tokens(self.messages)\n\n    @property\n    def stable_prefix_len(self) -> int:\n''',
          '''    @property\n    def tokens(self) -> int:\n        return approximate_tokens(self.messages)\n\n    @property\n    def estimated_request_tokens(self) -> int:\n        return self.tokens + self.request_overhead_tokens\n\n    def set_tool_schemas(self, schemas: list[dict[str, Any]]) -> None:\n        \"\"\"Reserve prompt space for schemas before the first model call.\n\n        The server's tokenizer is authoritative once it reports usage. Until then\n        a conservative serialized-size estimate prevents us pretending schemas are\n        free context.\n        \"\"\"\n        if not schemas:\n            return\n        serialized = json.dumps(schemas, sort_keys=True, default=str)\n        estimate = max(1, len(serialized) // 4) + self.calibration_margin_tokens\n        self.request_overhead_tokens = max(self.request_overhead_tokens, estimate)\n\n    def observe_prompt_tokens(self, prompt_tokens: int, message_tokens: int) -> None:\n        \"\"\"Calibrate fixed request overhead from a successful server call.\"\"\"\n        if prompt_tokens <= 0:\n            return\n        measured = max(0, prompt_tokens - message_tokens)\n        self.request_overhead_tokens = max(\n            self.request_overhead_tokens, measured + self.calibration_margin_tokens\n        )\n\n    @property\n    def stable_prefix_len(self) -> int:\n''')
          compact_pattern = re.compile(r'''    def needs_compaction\(self\) -> bool:\n.*?    def for_request\(self\) -> list\[dict\[str, Any\]\]:\n''', re.S)
          replacement = '''    def needs_compaction(self) -> bool:\n        return self.estimated_request_tokens > self.budget_tokens\n\n    def compact(self) -> CompactionEvent | None:\n        \"\"\"Collapse tool payloads until the *whole request* is back in budget.\n\n        Prefer old results so recent evidence survives. If that is insufficient,\n        collapse recent results too rather than sending an oversized prompt. The\n        summary/evidence handle remains and the model can re-run a narrower call.\n        \"\"\"\n        before = self.estimated_request_tokens\n        if before <= self.budget_tokens:\n            return None\n\n        target_total = int(self.budget_tokens * self.hysteresis)\n        target_messages = max(0, target_total - self.request_overhead_tokens)\n        tool_indices = [i for i, m in enumerate(self.messages) if m.get("role") == "tool"]\n        old = (\n            tool_indices[: -self.keep_recent_tool_results]\n            if self.keep_recent_tool_results\n            else tool_indices\n        )\n        recent = [i for i in tool_indices if i not in old]\n\n        first_touched = len(self.messages)\n        collapsed = 0\n        for idx in [*old, *recent]:\n            try:\n                already = json.loads(self.messages[idx].get("content") or "{}")\n            except (ValueError, TypeError):\n                already = {}\n            if isinstance(already, dict) and already.get("collapsed"):\n                continue\n            self.messages[idx] = _collapse(self.messages[idx])\n            first_touched = min(first_touched, idx)\n            collapsed += 1\n            if self.tokens <= target_messages:\n                break\n\n        if not collapsed:\n            return None\n\n        event = CompactionEvent(\n            at_message_index=first_touched,\n            tokens_before=before,\n            tokens_after=self.estimated_request_tokens,\n            collapsed_results=collapsed,\n        )\n        self.compactions.append(event)\n        return event\n\n    def for_request(self) -> list[dict[str, Any]]:\n'''
          text, count = compact_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'context compact block replacement count={count}')
          text = text.replace(
          '''            "approx_tokens": self.tokens,\n            "budget_tokens": self.budget_tokens,\n''',
          '''            "approx_tokens": self.tokens,\n            "request_overhead_tokens": self.request_overhead_tokens,\n            "estimated_request_tokens": self.estimated_request_tokens,\n            "budget_tokens": self.budget_tokens,\n''')
          path.write_text(text, encoding='utf-8')

          # A 400 prompt-length refusal is a controller/context condition, not a dead server.
          path = Path('internal/local_agent/llm/client.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def _http_stack() -> Any:\n'''
          helper = '''def _transport_kind(exc: Exception) -> str:\n    \"\"\"Classify transport failures without calling a live server dead.\"\"\"\n    name = type(exc).__name__\n    message = str(exc).lower()\n    if (\n        "input length exceeds" in message\n        or ("maximum allowed length" in message and "input" in message)\n    ):\n        return "context_overflow"\n    if "timeout" in name.lower() or "timeout" in message:\n        return "stalled"\n    return "unavailable"\n\n\n'''
          if helper not in text:
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace(
          '''                    f"{name}: {exc}", cause=name,\n                    kind="stalled" if "Timeout" in name else "unavailable",\n''',
          '''                    f"{name}: {exc}", cause=name, kind=_transport_kind(exc),\n''')
          text = text.replace(
          '''                    f"{type(exc2).__name__}: {exc2}", cause=type(exc2).__name__\n''',
          '''                    f"{type(exc2).__name__}: {exc2}", cause=type(exc2).__name__,\n                    kind=_transport_kind(exc2)\n''')
          text = text.replace(
          '''                    f"{type(exc).__name__}: {exc}", cause=type(exc).__name__\n                ) from exc\n            started = time.monotonic()\n''',
          '''                    f"{type(exc).__name__}: {exc}", cause=type(exc).__name__,\n                    kind=_transport_kind(exc)\n                ) from exc\n            started = time.monotonic()\n''')
          # The retry block has the same shape after streaming compatibility fallbacks.
          text = text.replace(
          '''                    f"{type(exc2).__name__}: {exc2}", cause=type(exc2).__name__\n                ) from exc2\n\n        ttft: float | None = None\n''',
          '''                    f"{type(exc2).__name__}: {exc2}", cause=type(exc2).__name__,\n                    kind=_transport_kind(exc2)\n                ) from exc2\n\n        ttft: float | None = None\n''')
          path.write_text(text, encoding='utf-8')

          # Typed halt for a local prompt budget exhaustion.
          replace_once(
              'internal/local_agent/agent/state.py',
              '''    INFERENCE_STALLED = "inference_stalled"    # server alive, request made no progress\n''',
              '''    INFERENCE_STALLED = "inference_stalled"    # server alive, request made no progress\n    CONTEXT_BUDGET_EXHAUSTED = "context_budget_exhausted"  # request would exceed local model cap\n'''
          )

          # Generic oversized tool payload guidance must work for list_files too.
          path = Path('internal/local_agent/tools/base.py')
          text = path.read_text(encoding='utf-8')
          old = '''        trimmed = {\n            "ok": self.ok,\n            "summary": self.summary,\n            "truncated": True,\n            "note": (\n                "Result exceeded the tool-result budget. Use read_log_chunk or "\n                "read_file against the listed artifacts to page through it."\n            ),\n            "artifacts": self.artifacts,\n        }\n'''
          new = '''        note = (\n            "Result exceeded the tool-result budget. Use read_log_chunk or read_file "\n            "against the listed artifacts to page through it."\n            if self.artifacts\n            else "Result exceeded the tool-result budget. Repeat the tool with a "\n                 "smaller limit or a narrower path/pattern."\n        )\n        trimmed = {\n            "ok": self.ok,\n            "summary": self.summary,\n            "truncated": True,\n            "note": note,\n            "artifacts": self.artifacts,\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit('base.py trim block did not match')
          path.write_text(text.replace(old, new), encoding='utf-8')

          # Wire the profile's declared context/result budgets into orchestration.
          path = Path('internal/local_agent/agent/orchestrator.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
          '''        ctx = ContextManager(budget_tokens=budget)\n        ctx.append(ctxmod.build_system_message(\n''',
          '''        ctx = ContextManager(budget_tokens=budget)\n        active_config = (\n            tiered.config_for() if tiered is not None\n            else getattr(self.client, "config", None)\n        )\n        tool_result_max_bytes = self.repo.policy.max_tool_result_bytes\n        if active_config is not None:\n            token_cap = int(getattr(active_config, "max_tool_result_tokens", 0) or 0)\n            if token_cap > 0:\n                tool_result_max_bytes = min(\n                    tool_result_max_bytes, max(512, token_cap * 4)\n                )\n        ctx.append(ctxmod.build_system_message(\n''')
          text = text.replace(
          '''        schemas = self.registry.schemas(toolset)\n        self.observer("toolset", {"tools": toolset})\n''',
          '''        schemas = self.registry.schemas(toolset)\n        ctx.set_tool_schemas(schemas)\n        self.observer("toolset", {"tools": toolset})\n''')
          text = text.replace(
          '''            state.metrics.context_peak_tokens = max(\n                state.metrics.context_peak_tokens, ctx.tokens\n            )\n\n            try:\n                response = self.client.chat(ctx.for_request(), tools=schemas)\n''',
          '''            state.metrics.context_peak_tokens = max(\n                state.metrics.context_peak_tokens, ctx.estimated_request_tokens\n            )\n            if ctx.estimated_request_tokens > budget:\n                state.halt(\n                    HaltCause.CONTEXT_BUDGET_EXHAUSTED,\n                    f"context budget exhausted before inference: estimated request "\n                    f"{ctx.estimated_request_tokens} tokens exceeds budget {budget}",\n                )\n                self.observer(\n                    "context_budget_exhausted",\n                    {"estimated": ctx.estimated_request_tokens, "budget": budget},\n                )\n                break\n\n            message_tokens_before_request = ctx.tokens\n            try:\n                response = self.client.chat(ctx.for_request(), tools=schemas)\n''')
          text = text.replace(
          '''                if getattr(exc, "kind", "unavailable") == "stalled":\n                    state.halt(HaltCause.INFERENCE_STALLED, f"inference stalled: {exc}")\n                    self.observer("server_stalled", {"error": str(exc), "cause": exc.cause})\n                else:\n''',
          '''                kind = getattr(exc, "kind", "unavailable")\n                if kind == "context_overflow":\n                    state.halt(\n                        HaltCause.CONTEXT_BUDGET_EXHAUSTED,\n                        f"inference request exceeded the model context limit: {exc}",\n                    )\n                    self.observer(\n                        "context_budget_exhausted",\n                        {"error": str(exc), "cause": exc.cause},\n                    )\n                elif kind == "stalled":\n                    state.halt(HaltCause.INFERENCE_STALLED, f"inference stalled: {exc}")\n                    self.observer("server_stalled", {"error": str(exc), "cause": exc.cause})\n                else:\n''')
          text = text.replace(
          '''            state.metrics.observe_call(response.stats)\n            self.observer("llm", response.stats.as_dict())\n''',
          '''            state.metrics.observe_call(response.stats)\n            ctx.observe_prompt_tokens(\n                response.stats.prompt_tokens, message_tokens_before_request\n            )\n            self.observer("llm", response.stats.as_dict())\n''')
          text = text.replace(
          '''                        outcome.to_json(self.repo.policy.max_tool_result_bytes),\n''',
          '''                        outcome.to_json(tool_result_max_bytes),\n''')
          text = text.replace(
          '''            state.metrics.context_peak_tokens, ctx.tokens\n''',
          '''            state.metrics.context_peak_tokens, ctx.estimated_request_tokens\n''')
          path.write_text(text, encoding='utf-8')

          # Regression coverage for the physical NPU failure.
          Path('internal/tests/unit/test_context_budget_guard.py').write_text(r'''import json

from local_agent.agent.context import ContextManager, tool_result_message
from local_agent.llm.client import _transport_kind
from local_agent.tools.base import ToolResult


def test_request_budget_includes_tool_schema_overhead_and_server_calibration():
    ctx = ContextManager(budget_tokens=7500)
    ctx.append({"role": "system", "content": "x" * 4000})
    visible = ctx.tokens
    ctx.set_tool_schemas([
        {"type": "function", "function": {"name": "list_files", "parameters": {"type": "object", "description": "y" * 2400}}}
    ])
    assert ctx.estimated_request_tokens > visible

    before = ctx.tokens
    ctx.observe_prompt_tokens(before + 1700, before)
    assert ctx.request_overhead_tokens >= 1828
    assert ctx.estimated_request_tokens == ctx.tokens + ctx.request_overhead_tokens


def test_compaction_can_collapse_recent_large_tool_result_to_avoid_overflow():
    ctx = ContextManager(budget_tokens=1800, keep_recent_tool_results=6, hysteresis=0.7)
    ctx.set_tool_schemas([{"name": "list_files", "description": "schema" * 80}])
    ctx.append({"role": "system", "content": "rules" * 100})
    ctx.append({"role": "user", "content": "summarize repo"})
    payload = json.dumps({"ok": True, "summary": "100 files", "data": {"files": [f"internal/path/{i}/file.cpp" for i in range(400)]}})
    ctx.append(tool_result_message("call_1", "list_files", payload))
    assert ctx.needs_compaction()
    event = ctx.compact()
    assert event is not None
    assert event.collapsed_results == 1
    assert json.loads(ctx.messages[-1]["content"])["collapsed"] is True
    assert ctx.estimated_request_tokens < event.tokens_before


def test_model_tool_result_token_budget_can_drop_oversized_payload_without_artifact():
    result = ToolResult(True, "100 files", data={"files": ["x" * 100 for _ in range(100)]})
    rendered = json.loads(result.to_json(max_bytes=800))
    assert rendered["truncated"] is True
    assert rendered["artifacts"] == []
    assert "smaller limit" in rendered["note"]


def test_prompt_length_bad_request_is_not_classified_as_server_unavailable():
    exc = RuntimeError("400: Input length exceeds the maximum allowed length")
    assert _transport_kind(exc) == "context_overflow"
''', encoding='utf-8')
          PY

      - name: Install and run targeted regressions
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q internal/tests/unit/test_context_budget_guard.py internal/tests/unit/test_repo_navigation_small_model_contract.py

      - name: Restamp source-only identity and commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'internal')
          from local_agent import provenance as p

          instrument = Path('internal/INSTRUMENT.json')
          data = json.loads(instrument.read_text(encoding='utf-8'))
          source = p.source_sha256()
          base = p.base_prompt_sha256()
          outcome = p.outcome_contract_sha256()
          assert base == data['base_prompt_sha256'], (base, data['base_prompt_sha256'])
          assert outcome == data['outcome_contract_sha256'], (outcome, data['outcome_contract_sha256'])
          data['source_sha256'] = source
          instrument.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print('source_sha256', source)
          print('base_prompt_sha256', base)
          print('outcome_contract_sha256', outcome)
          PY
          rm .github/workflows/apply-context-budget-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden NPU context budgeting"
          git push
