name: apply context budget fix

on:
  push:
    branches: [fix/post-refactor-review]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-refactor-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python .github/apply_context_budget_fix.py
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Targeted regressions
        run: python -m pytest -q internal/tests/unit/test_context_budget_guard.py internal/tests/unit/test_repo_navigation_small_model_contract.py
      - name: Restamp source identity and commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'internal')
          from local_agent import provenance as p
          path = Path('internal/INSTRUMENT.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          source = p.source_sha256()
          base = p.base_prompt_sha256()
          outcome = p.outcome_contract_sha256()
          assert base == data['base_prompt_sha256'], (base, data['base_prompt_sha256'])
          assert outcome == data['outcome_contract_sha256'], (outcome, data['outcome_contract_sha256'])
          data['source_sha256'] = source
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print('source_sha256', source)
          print('base_prompt_sha256', base)
          print('outcome_contract_sha256', outcome)
          PY
          rm .github/apply_context_budget_fix.py .github/workflows/apply-context-budget-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden NPU context budgeting"
          git push
