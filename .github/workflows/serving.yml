name: serving

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: serving-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  serving:
    name: serving (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Capture declared CI job scope and checkout identity
        env:
          LCA_ARTIFACT_NAME: ci-job-serving-serving-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          LCA_COMMAND_SCOPE: serving
          LCA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LCA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LCA_CHECKOUT_EVIDENCE: ci-job-evidence.json
        run: python internal/devtools/capture_ci_checkout.py
      - name: Upload declared CI job scope and checkout identity
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-serving-serving-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          path: ci-job-evidence.json
          if-no-files-found: error
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest internal/tests/test_serving.py internal/tests/unit/test_session_managed_runtime.py
      - name: Native PowerShell 5.1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = @(
            'install.ps1',
            'local-code-agent.ps1',
            'internal/work-laptop-one-shot.ps1',
            'internal/bootstrap-work-laptop.ps1',
            'internal/bootstrap-work-laptop-core.ps1',
            'internal/scripts/demo-accelerator.ps1',
            'demo/run-qwen-on-npu.ps1',
            'demo/run-qwen-on-gpu.ps1',
            'demo/run-qwen-on-cpu.ps1',
            'demo/show-stale-test-rejection.ps1',
            'demo/run-complete-local-code-agent-demo.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; exit 1 }
          }
