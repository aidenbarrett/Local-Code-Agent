name: product acceptance

# Exercise the public Windows composition from a fresh managed checkout environment.
# This is product acceptance, not a replacement for authoritative pytest or physical
# hardware acceptance. It uses no live model, network repair or machine-level installer mutation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: product-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-public-surface:
    name: windows public surface
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Capture checkout identity
        shell: pwsh
        env:
          LCA_ARTIFACT_NAME: ci-job-product-acceptance-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          LCA_COMMAND_SCOPE: installed-public-product-acceptance
          LCA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LCA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LCA_CHECKOUT_EVIDENCE: ci-job-evidence.json
        run: python internal/devtools/capture_ci_checkout.py

      - name: Upload checkout identity
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-product-acceptance-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          path: ci-job-evidence.json
          if-no-files-found: error

      - name: Copy checkout to a user-like path containing spaces
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Local Code Agent Product Acceptance'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          robocopy . $target /E /XD .git .venv .venv-workstation .pytest_cache __pycache__ | Out-Null
          $copyRc = $LASTEXITCODE
          if ($copyRc -ge 8) { throw "robocopy failed with exit code $copyRc" }
          $global:LASTEXITCODE = 0
          "LCA_ACCEPTANCE_ROOT=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create the managed checkout environment
        shell: pwsh
        run: |
          Set-Location $env:LCA_ACCEPTANCE_ROOT
          python -m venv .venv-workstation
          .\.venv-workstation\Scripts\python.exe -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Public launcher accepts the installed runtime
        shell: pwsh
        run: |
          Set-Location $env:LCA_ACCEPTANCE_ROOT
          & .\local-code-agent.ps1 help
          if ($LASTEXITCODE -ne 0) { throw "public help failed with exit code $LASTEXITCODE" }
          & .\local-code-agent.ps1 capabilities
          if ($LASTEXITCODE -ne 0) { throw "public capabilities failed with exit code $LASTEXITCODE" }

      - name: Public doctor reports readiness read-only, twice
        shell: pwsh
        run: |
          Set-Location $env:LCA_ACCEPTANCE_ROOT
          # A fresh runtime root: no model choice, weights or server. doctor must name
          # the next step and leave the root exactly as absent as it found it.
          $env:LCA_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'lca doctor runtime'
          $transcripts = @()
          foreach ($launch in 1, 2) {
            $output = (& .\local-code-agent.ps1 doctor 2>&1 | Out-String)
            $rc = $LASTEXITCODE
            Write-Host "--- doctor launch $launch (exit $rc) ---"
            Write-Host $output
            if ($rc -ne 3) { throw "doctor on a fresh machine must exit 3 (not ready), got $rc" }
            if ($output -notmatch 'Weights\s+MISSING') { throw 'doctor did not report the missing weights' }
            if ($output -notmatch 'models pull ptl-gpu-30b') { throw 'doctor did not name the weights next step' }
            if ($output -notmatch 'C\+\+ compiler\s+READY') { throw 'doctor did not find the runner MSVC' }
            if (Test-Path $env:LCA_RUNTIME_ROOT) { throw 'doctor created the runtime root' }
            $transcripts += $output
          }
          if ($transcripts[0] -ne $transcripts[1]) { throw 'a second doctor launch reported differently' }
          $global:LASTEXITCODE = 0

      - name: Public launcher declares, builds and tests a fresh CMake repository
        shell: pwsh
        run: |
          # #459: the documented root commands on a new repository in a path with
          # spaces, no model. R02 must be a verified full build and R03 a verified
          # full test run, as separate tasks, with Git status unchanged.
          $launcher = Join-Path $env:LCA_ACCEPTANCE_ROOT 'local-code-agent.ps1'
          $env:LCA_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'lca fresh runtime'
          $repo = Join-Path $env:RUNNER_TEMP 'fresh cmake project'
          if (Test-Path $repo) { Remove-Item -Recurse -Force $repo }
          New-Item -ItemType Directory -Force -Path (Join-Path $repo 'src') | Out-Null
          Set-Content -Path (Join-Path $repo 'CMakeLists.txt') -Value @(
            'cmake_minimum_required(VERSION 3.20)', 'project(fresh CXX)', 'enable_testing()',
            'add_executable(fresh_test src/fresh_test.cpp)', 'add_test(NAME fresh COMMAND fresh_test)')
          Set-Content -Path (Join-Path $repo 'src\fresh_test.cpp') -Value 'int main() { return 0; }'
          Set-Content -Path (Join-Path $repo '.gitignore') -Value @('build/', '.local-agent/')
          Set-Location $repo
          git init -q
          git -c user.email=ci@example.invalid -c user.name=ci add -A
          git -c user.email=ci@example.invalid -c user.name=ci commit -qm fresh
          Set-Location (Join-Path $repo 'src')
          & $launcher init --write
          if ($LASTEXITCODE -ne 0) { throw "init --write failed with exit code $LASTEXITCODE" }
          Set-Location $repo
          git -c user.email=ci@example.invalid -c user.name=ci add .local-agent.toml
          git -c user.email=ci@example.invalid -c user.name=ci commit -qm declare
          $before = (git status --porcelain=v1 | Out-String)
          $evidence = Join-Path $env:RUNNER_TEMP 'fresh evidence'
          & $launcher acceptance --output $evidence --repo . --allow-build --only R02-build --only R03-tests
          $after = (git status --porcelain=v1 | Out-String)
          if ($after -ne $before) { throw 'the journeys changed tracked or unignored work' }
          $report = Get-Content -Raw (Join-Path $evidence 'journeys.json') | ConvertFrom-Json
          $build = $report.journeys | Where-Object { $_.id -eq 'R02-build' }
          $tests = $report.journeys | Where-Object { $_.id -eq 'R03-tests' }
          Write-Host ("R02-build: {0} scope={1}" -f $build.status, $build.tasks[0].proof_scope)
          Write-Host ("R03-tests: {0} scope={1} evidence={2}" -f $tests.status, $tests.tasks[0].proof_scope, ($tests.tasks[0].evidence_ids -join ','))
          if ($build.status -ne 'MEASURED:pass' -or $build.tasks[0].proof_scope -ne 'full_build') { throw 'R02 did not prove a full build' }
          if ($tests.status -ne 'MEASURED:pass' -or $tests.tasks[0].proof_scope -ne 'full_test') { throw 'R03 did not prove a full test run' }
          if ($build.tasks[0].task_id -eq $tests.tasks[0].task_id) { throw 'build and test proof are not separate tasks' }
          $global:LASTEXITCODE = 0

      - name: Public launcher ignores hostile ambient Python configuration
        shell: pwsh
        run: |
          Set-Location $env:LCA_ACCEPTANCE_ROOT
          $env:PYTHONHOME = Join-Path $env:RUNNER_TEMP 'not-a-python-home'
          $env:PYTHONPATH = Join-Path $env:RUNNER_TEMP 'untrusted-python-path'
          & .\local-code-agent.ps1 help
          if ($LASTEXITCODE -ne 0) { throw "public launcher leaked ambient Python configuration" }

      - name: Public launcher fails before product startup when a declared dependency disappears
        shell: pwsh
        run: |
          Set-Location $env:LCA_ACCEPTANCE_ROOT
          .\.venv-workstation\Scripts\python.exe -m pip uninstall -y jsonschema
          $output = (& .\local-code-agent.ps1 help 2>&1 | Out-String)
          $rc = $LASTEXITCODE
          Write-Host $output
          if ($rc -eq 0) { throw 'launcher accepted a managed environment missing jsonschema' }
          if ($output -notmatch 'runtime preflight failed') { throw 'missing dependency did not fail at runtime preflight' }
          if ($output -notmatch 'jsonschema') { throw 'runtime preflight did not identify the missing dependency' }
          $global:LASTEXITCODE = 0

      - name: Explicit reinstall repairs the managed checkout environment
        shell: pwsh
        run: |
          Set-Location $env:LCA_ACCEPTANCE_ROOT
          .\.venv-workstation\Scripts\python.exe -m pip install --disable-pip-version-check -e ".[dev]"
          & .\local-code-agent.ps1 help
          if ($LASTEXITCODE -ne 0) { throw "public launcher did not recover after explicit reinstall" }
