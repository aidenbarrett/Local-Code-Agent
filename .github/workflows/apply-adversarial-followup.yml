name: apply adversarial follow-up

on:
  push:
    branches: [fix/adversarial-review-followup]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adversarial-review-followup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded fixes and restamp source identity
        run: |
          python .github/apply_adversarial_followup.py
          # Keep the regression semantic rather than Markdown-format-sensitive.
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          p.write_text(p.read_text(encoding='utf-8').replace('**not** independent tasks', 'not independent tasks'), encoding='utf-8', newline='\n')
          PY
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Fixture remains deterministic
        run: |
          python internal/benchmark_fixture/generate_project.py
          git diff --exit-code -- internal/benchmark_fixture/cpp_project
      - name: Targeted regressions
        run: >-
          python -m pytest -q
          internal/tests/unit/test_chat_server_orchestration.py
          internal/tests/unit/test_compatibility_runner_fail_closed.py
          internal/tests/unit/test_adversarial_followup_contracts.py
      - name: Authoritative pytest
        run: python -m pytest -q
      - name: Offline compatibility runner default path
        run: python internal/measurement/run_test_suite.py
      - name: Declared instrument identities match patched tree
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'internal')
          from local_agent import provenance as p
          d = json.load(open('internal/INSTRUMENT.json', encoding='utf-8'))
          actual = (p.source_sha256(), p.base_prompt_sha256(), p.outcome_contract_sha256())
          declared = (d['source_sha256'], d['base_prompt_sha256'], d['outcome_contract_sha256'])
          print('declared', declared)
          print('actual  ', actual)
          assert actual == declared
          PY
      - name: Commit repaired tree
        run: |
          git config user.name aidenbarrett
          git config user.email 33842164+aidenbarrett@users.noreply.github.com
          # The Actions token cannot publish workflow-file changes. Restore the
          # three workflow/finalizer files before committing; they are handled
          # separately through the repository API after this validated patch lands.
          git restore --source=HEAD -- .github/workflows/serving.yml .github/workflows/apply-adversarial-followup.yml .github/apply_adversarial_followup.py
          git add -A
          git status --short
          git commit -m "Close adversarial review defects"
          git push origin HEAD:fix/adversarial-review-followup
