name: pr74 finish migration

on:
  push:
    branches: [refactor/tools-inference-naming]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Complete explicit-module migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path.cwd()
          active_roots = [
              root / "internal/local_agent",
              root / "internal/tests",
              root / "internal/scripts",
              root / "internal/evaluation",
              root / "internal/measurement",
          ]

          global_replacements = {
              "local_agent.tools.base": "local_agent.tools.tool_primitives",
              "local_agent.tools.context": "local_agent.tools.tool_context",
              "local_agent.tools.runner": "local_agent.tools.process_runner",
              "local_agent.tools.testing": "local_agent.tools.testing_tools",
              "local_agent.llm.models": "local_agent.llm.protocol",
              "local_agent.llm.router": "local_agent.llm.model_tiers",
          }
          package_replacements = {
              "from ..tools.base import": "from ..tools.tool_primitives import",
              "from ..tools.context import": "from ..tools.tool_context import",
              "from ..tools.runner import": "from ..tools.process_runner import",
              "from ..tools.testing import": "from ..tools.testing_tools import",
              "from ..llm.models import": "from ..llm.protocol import",
              "from ..llm.router import": "from ..llm.model_tiers import",
              "from .llm.models import": "from .llm.protocol import",
              "from .llm.router import": "from .llm.model_tiers import",
          }

          for base in active_roots:
              if not base.exists():
                  continue
              for path in sorted(base.rglob("*.py")):
                  text = path.read_text(encoding="utf-8")
                  original = text
                  for old, new in global_replacements.items():
                      text = text.replace(old, new)
                  for old, new in package_replacements.items():
                      text = text.replace(old, new)
                  if root / "internal/local_agent/tools" in path.parents:
                      text = text.replace("from .base import", "from .tool_primitives import")
                      text = text.replace("from .context import", "from .tool_context import")
                      text = text.replace("from .runner import", "from .process_runner import")
                      text = text.replace("from .testing import", "from .testing_tools import")
                      text = text.replace("from . import testing as", "from . import testing_tools as")
                  if root / "internal/local_agent/llm" in path.parents:
                      text = text.replace("from .models import", "from .protocol import")
                      text = text.replace("from .router import", "from .model_tiers import")
                  # Keep comments/docstrings honest too, without touching unrelated modules.
                  text = text.replace("tools.base", "tools.tool_primitives")
                  text = text.replace("llm.models", "llm.protocol")
                  text = text.replace("llm.router", "llm.model_tiers")
                  if path.name == "test_runtime_agnostic.py":
                      text = text.replace('"models.py"', '"protocol.py"')
                  if text != original:
                      path.write_text(text, encoding="utf-8")

          retired = [
              root / "internal/local_agent/tools/base.py",
              root / "internal/local_agent/tools/context.py",
              root / "internal/local_agent/tools/runner.py",
              root / "internal/local_agent/tools/testing.py",
              root / "internal/local_agent/llm/models.py",
              root / "internal/local_agent/llm/router.py",
          ]
          for path in retired:
              path.unlink()

          guard = root / "internal/tests/unit/test_pr_d_legacy_imports.py"
          guard.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\nINTERNAL = Path(__file__).resolve().parents[2]\nRETIRED = (\n    INTERNAL / "local_agent/tools/base.py",\n    INTERNAL / "local_agent/tools/context.py",\n    INTERNAL / "local_agent/tools/runner.py",\n    INTERNAL / "local_agent/tools/testing.py",\n    INTERNAL / "local_agent/llm/models.py",\n    INTERNAL / "local_agent/llm/router.py",\n)\n\n\ndef test_pr_d_retired_module_paths_stay_absent() -> None:\n    present = [str(path.relative_to(INTERNAL)) for path in RETIRED if path.exists()]\n    assert not present, "retired PR-D module paths reappeared:\\n" + "\\n".join(present)\n''', encoding="utf-8")

          # Stamp only the source axis. The model-facing and outcome-facing contracts
          # must remain byte-identical across this ownership-only migration.
          from local_agent import provenance
          instrument_path = root / "internal/INSTRUMENT.json"
          declared = json.loads(instrument_path.read_text(encoding="utf-8"))
          actual_prompt = provenance.base_prompt_sha256()
          actual_outcome = provenance.outcome_contract_sha256()
          assert actual_prompt == declared["base_prompt_sha256"], (
              "base prompt contract moved during naming-only migration",
              declared["base_prompt_sha256"], actual_prompt,
          )
          assert actual_outcome == declared["outcome_contract_sha256"], (
              "outcome contract moved during naming-only migration",
              declared["outcome_contract_sha256"], actual_outcome,
          )
          declared["source_sha256"] = provenance.source_sha256()
          instrument_path.write_text(json.dumps(declared, indent=2) + "\n", encoding="utf-8")
          print("source_sha256", declared["source_sha256"])
          print("base_prompt_sha256", actual_prompt)
          print("outcome_contract_sha256", actual_outcome)
          PY

          python internal/benchmark_fixture/generate_project.py
          git diff --check
          python -m pytest -q \
            internal/tests/unit/test_pr_d_legacy_imports.py \
            internal/tests/unit/test_runtime_agnostic.py \
            internal/tests/unit/test_provenance_surface.py \
            internal/tests/unit/test_metrics_and_context.py
          python -m pytest -q
          python internal/measurement/run_test_suite.py internal/tests
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PR D import migration"
          git push origin HEAD:refactor/tools-inference-naming
