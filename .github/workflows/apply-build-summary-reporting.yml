name: apply build summary reporting

on:
  push:
    branches: [fix/post-refactor-review]
    paths:
      - internal/scripts/_hotfix_build_summary_reporting.py
      - .github/workflows/apply-build-summary-reporting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-refactor-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair
        run: python internal/scripts/_hotfix_build_summary_reporting.py
      - name: Run targeted regressions
        run: >-
          python internal/measurement/run_test_suite.py
          internal/tests/unit/test_build_summary_gate_contract.py
          internal/tests/unit/test_repo_navigation_small_model_contract.py
          internal/tests/unit/test_context_budget_guard.py
      - name: Commit repaired tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/local_agent/agent/orchestrator.py internal/tests/unit/test_build_summary_gate_contract.py internal/INSTRUMENT.json
          git add -u internal/scripts/_hotfix_build_summary_reporting.py .github/workflows/apply-build-summary-reporting.yml
          git diff --cached --check
          git commit -m "Tighten build-summary reporting contract"
          git push
