name: Reconcile PR8 source identity

on:
  push:
    branches: [feature/preset-serving]

permissions:
  contents: write

concurrency:
  group: reconcile-pr8-source
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Recompute combined generation-2 identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from local_agent import provenance as p

          path = Path("INSTRUMENT.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("generation") != 2:
              raise SystemExit("refusing to rewrite non-generation-2 instrument")

          actual_prompt = p.base_prompt_sha256()
          actual_outcome = p.outcome_contract_sha256()
          if data.get("base_prompt_sha256") != actual_prompt:
              raise SystemExit(
                  "base_prompt_sha256 moved while integrating PR8; this is a generation boundary"
              )
          if data.get("outcome_contract_sha256") != actual_outcome:
              raise SystemExit(
                  "outcome_contract_sha256 moved while integrating PR8; this is a generation boundary"
              )

          actual_source = p.source_sha256()
          print("source_sha256", actual_source)
          print("base_prompt_sha256", actual_prompt)
          print("outcome_contract_sha256", actual_outcome)

          if data.get("source_sha256") == actual_source:
              print("combined source identity already reconciled")
              raise SystemExit(0)

          data["source_sha256"] = actual_source
          path.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
      - name: Commit source-only identity reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- INSTRUMENT.json; then
            echo "no source identity update required"
            exit 0
          fi
          git config user.name "pr8-identity-reconciler"
          git config user.email "pr8-identity-reconciler@users.noreply.github.com"
          git add INSTRUMENT.json
          git commit -m "Reconcile combined PR7 and PR8 source identity"
          git push origin HEAD:feature/preset-serving
