name: Energy study candidate finalizer

on:
  push:
    branches:
      - measurement/energy-study
    paths:
      - tools/energy-study.trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: measurement/energy-study
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev environment
        run: python -m pip install -e '.[dev]'
      - name: Reconcile source identity and refuse contract drift
        shell: python
        run: |
          import json
          from pathlib import Path
          from local_agent import provenance as p

          expected_prompt = 'f1fb88236b18c2aa21d396a91cdc878274005cb47d687b1442811c6a740f1559'
          expected_outcome = '63c4bf907baa0cf2e406696bb7d65cdf4eef8feac206408fb7e4ffc3cb26efa8'
          prompt = p.base_prompt_sha256()
          outcome = p.outcome_contract_sha256()
          source = p.source_sha256()
          if prompt != expected_prompt:
              raise SystemExit(f'base prompt moved: {prompt}')
          if outcome != expected_outcome:
              raise SystemExit(f'outcome contract moved: {outcome}')
          path = Path('INSTRUMENT.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('generation') != 2:
              raise SystemExit(f"unexpected generation: {data.get('generation')}")
          data['source_sha256'] = source
          data['base_prompt_sha256'] = prompt
          data['outcome_contract_sha256'] = outcome
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print('source_sha256', source)
          print('base_prompt_sha256', prompt)
          print('outcome_contract_sha256', outcome)
      - name: Targeted energy regressions
        run: python -m pytest -q tests/unit/test_energy_measurement.py tests/unit/test_energy_study.py tests/unit/test_provenance.py
      - name: Authoritative Linux suite
        run: python -m pytest -q
      - name: Diff hygiene
        run: git diff --check
      - name: Remove one-shot machinery and verify final identities
        shell: bash
        run: |
          rm -f .github/workflows/energy-study-finalize.yml tools/energy-study.trigger
          python - <<'PY'
          import json
          from pathlib import Path
          from local_agent import provenance as p

          expected_prompt = 'f1fb88236b18c2aa21d396a91cdc878274005cb47d687b1442811c6a740f1559'
          expected_outcome = '63c4bf907baa0cf2e406696bb7d65cdf4eef8feac206408fb7e4ffc3cb26efa8'
          data = json.loads(Path('INSTRUMENT.json').read_text(encoding='utf-8'))
          source = p.source_sha256()
          prompt = p.base_prompt_sha256()
          outcome = p.outcome_contract_sha256()
          if data.get('generation') != 2:
              raise SystemExit('generation moved')
          if data.get('source_sha256') != source:
              raise SystemExit(f"declared source {data.get('source_sha256')} != recomputed {source}")
          if prompt != expected_prompt or data.get('base_prompt_sha256') != expected_prompt:
              raise SystemExit('base prompt identity moved')
          if outcome != expected_outcome or data.get('outcome_contract_sha256') != expected_outcome:
              raise SystemExit('outcome contract identity moved')
          print('final identities verified')
          PY
          git diff --check
      - name: Publish coherent candidate
        shell: bash
        run: |
          git config user.name 'energy-study-finalizer'
          git config user.email 'energy-study-finalizer@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze energy study instrumentation before row one'
          git push origin HEAD:measurement/energy-study
