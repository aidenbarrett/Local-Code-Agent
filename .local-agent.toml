# The agent's own repository, so it can be pointed at itself.
[repo]
name = "local-code-agent"
build_dir = "build"
run_dir = ".local-agent/runs"
default_profile = "python"
skills_dir = "internal/skills"

[profiles.python]
configure = []
build = ["python", "-c", "import compileall,sys; sys.exit(0 if compileall.compile_dir('internal/local_agent', quiet=1) else 1)"]
test = ["python", "-m", "pytest", "-q"]

[policy]
allow_build = true
allow_test = true
allow_patch = false
allow_commit = false
command_timeout_seconds = 600
max_tool_calls = 40
