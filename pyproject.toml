[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-code-agent"
version = "0.1.0"
description = "Local C++ engineering agent. The orchestrator owns the workflow; the model is a replaceable part."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "psutil>=6.0",
    "jsonschema>=4.23",
    "textual>=0.89,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
coverage = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
parallel = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
]

[project.scripts]
local-agent = "local_agent.cli:main"

[tool.setuptools.packages.find]
where = ["internal"]
include = ["local_agent*"]

# The built-in skills currently live outside the Python package and are available
# from a source checkout/release tree. A wheel is not considered self-contained
# until those assets move under package data with an explicit installation test.

[tool.pytest.ini_options]
testpaths = ["internal/tests"]
addopts = "-q"
