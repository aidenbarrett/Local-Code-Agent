[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-code-agent"
version = "0.1.0"
description = "Local C++ engineering agent. The orchestrator owns the workflow; the model is a replaceable part."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
local-agent = "local_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
